name: Suggest a tool
description: Suggest a free (or very cheap) tool for learning IT. No Git knowledge needed.
title: "Suggest: "
labels: [suggestion]
body:
  - type: input
    id: name
    attributes:
      label: Name of the tool
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official link
    validations:
      required: true
  - type: dropdown
    id: price
    attributes:
      label: Cost
      options: [Free, Free with paid extras, Low cost, Paid, Not sure]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it good? Who is it for?
      description: Two or three sentences are enough. Tell us if it worked for you.
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Languages available
      placeholder: English, Spanish
