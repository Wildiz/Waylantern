title: 'First project: IT support and help desk'
summary: Practise basic Linux diagnosis and document a simulated support case in a ticket lab.
areas:
- it-support
intro: 'IT support and help desk work involves understanding a reported problem, checking evidence, helping
  a user and documenting the result or escalation. This route introduces those habits through a Linux practice
  system and a separate ticketing lab. Linux administration is only part of IT support: Windows support, desktop
  hardware, identity administration and organisation-specific procedures are outside this short route. It is
  a first project, not a full support qualification or a promise of employment. Use disposable local systems
  and invented users, assets and tickets; GLPI is a service-desk tool, not a complete support course.

  '
steps:
- title: Get comfortable with a Linux practice system
  short: Learn the basic tools
  tools:
  - linux-upskill-challenge
  why: 'Use the setup lesson to choose a practice system you control; a local lab avoids assuming a paid cloud
    server. Work through the early lessons on connecting, navigating files, reading help and installing software.
    Write down what each command tells you rather than copying commands without understanding their effect.
    Keep administrative experiments out of a personal or workplace production system.

    '
  advance_when: You can find a file, explain a basic system-status command and use its help page to check an
    option before running it.
- title: Diagnose one small service problem
  short: Gather evidence
  tools:
  - linux-upskill-challenge
  why: 'Use the course''s service and log lessons to practise a small case on your lab, such as checking whether
    the practice web service is running. Write down the reported symptom, the checks you performed and what
    the status output or logs showed. If you change a setting or restart a service, record the change and verify
    the result. Distinguish an observation from a guessed cause; do not claim a problem is solved merely because
    a command completed.

    '
  advance_when: You can show the symptom, a relevant status or log observation, the action taken and a check
    confirming the result or explaining what remains unknown.
- title: Turn the practice case into a support ticket
  short: Document a case
  tools:
  - glpi
  why: 'Start by writing a plain-text ticket for the service case from the previous step, with an invented
    user and asset. If you want to practise with a service-desk application, GLPI is an optional next lab:
    follow its documentation for an isolated test installation with a web server, PHP and database. Deploying
    GLPI is not required to complete this route. Include the symptom, impact, evidence, actions and outcome,
    plus a short plain-language reply to the user. Finish with either a verified resolution or an escalation
    note naming the next check and missing information. Export or capture an anonymised example as your microproject;
    do not enter real credentials or customer details.

    '
  advance_when: A second reader can follow the invented ticket from the initial report to a verified result
    or a clear escalation, using the evidence and notes you recorded.
entry_level: start-here
prerequisites: Basic computer skills and access to a disposable Linux practice environment; no programming
  experience is required.
