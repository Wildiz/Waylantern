title: "Path: software architecture"
summary: Turn a small application's requirements into a design you can explain and revise.
areas: [architecture]
intro: >-
  Software architects help teams choose system boundaries, interfaces and technical tradeoffs
  that fit a project's requirements. Start after you can write and debug a small program, use
  Git and explain a basic automated test; Path 0 is a better starting point if those are new.
  Use a small application you understand, such as a local task tracker, rather than starting
  with a large distributed system. Read only the sections needed for the current decision.
  This route introduces architectural reasoning; it does not make someone a professional
  architect or promise a job after completing a checklist.
steps:
  - title: Define the problem before choosing technologies
    short: Write requirements
    tools: [karan-system-design]
    why: >-
      Read the introductory system design section, then describe a tiny task tracker that can
      add a task, list tasks and mark one complete. State who uses it, what data must survive a
      restart and which features are outside your first version. Keep the first version local
      and single-user so the design has a clear boundary.
    advance_when: >-
      You have a one-page brief containing the three user actions, the persistence requirement,
      one failure to handle and explicit exclusions that another person could use to check the app.
  - title: Trace the boundaries in one small implementation
    short: Study one design
    tools: [500-lines-or-less]
    why: >-
      Choose one chapter with code in a language you can follow. Read its explanation alongside
      the implementation and sketch the main components and their interfaces. Follow one input
      through the program to its result, then identify one design decision and a possible
      alternative. You do not need to read or run every chapter.
    advance_when: >-
      You can explain the path of one input through the chosen example and describe a concrete
      benefit and cost of one boundary or interface used by its author.
  - title: Build the smallest version and record one decision
    short: Implement a small design
    tools: [500-lines-or-less]
    why: >-
      Apply the idea of explicit boundaries to your task tracker. Keep task rules separate
      from file storage behind a small interface; a command-line interface is sufficient.
      Implement the three actions, save tasks between runs and test the completion rule.
      Write a short decision note explaining the storage choice, an alternative and the
      tradeoff. This is your own exercise inspired by the book, not an assignment supplied by it.
    advance_when: >-
      Your three actions work, a task survives a restart, a test checks the completion rule,
      and you can identify which code would change if file storage were replaced.
  - title: Revisit the design when one requirement changes
    short: Compare tradeoffs
    tools: [system-design-primer]
    why: >-
      Imagine that two people now need to share the task list. Use the relevant system design
      sections to compare extending your single application with a shared database against
      splitting it into separate services. Draw the changed boundary and discuss conflicting
      updates, failures and operational work. Propose the simplest justified next version;
      you do not need to deploy either option or add infrastructure just to finish this step.
    advance_when: >-
      You have a revised diagram and a decision note that names a benefit and cost of each
      option, explains your choice for two users and states what evidence could change that choice.
