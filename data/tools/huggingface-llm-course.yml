verified: {date: 2026-10-21, method: github-repo, notes: "Re-checked 2026-10-21 on huggingface.co/learn/llm-course: the language picker lists 27 languages (incl. ES, FR, VI, ZH-CN, RU) but I sampled chapters 1, 4, 8 and 9 per language: fr, zh-CN, vi and ru have all four, es has only chapters 1 and 8 (the site says chapters 4, 9 and 11 do not exist in es), de/ja/ko/pt/tr/ar are partial or empty in the sample; chapters 11 (Fine-tune LLMs) and 12 (Build Reasoning Models) exist in English only. The hub huggingface.co/learn also lists newer courses (Context, Robotics, smol course, Agents, Diffusion, ML for 3D) that were not reviewed here. Price free is backed by open access without login on the site plus the Apache-2.0 repo."}
