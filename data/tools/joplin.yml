verified: {date: '2026-10-21', method: official-site, notes: 'joplinapp.org and GitHub README (laurent22/joplin, ~56.8k stars, last push 2026-10-21): platforms, sync targets and web clipper confirmed. Site is offered in en, fr, de, zh. Re-checked 2026-10-21: joplinapp.org/help says Joplin is a free, open source note taking and to-do application; joplinapp.org/plans lists Joplin Cloud Basic 2.99 EUR/month (2.40 EUR/month billed yearly, 28.69 EUR/year; 2 GB), Pro 5.99 EUR/month and Pro 100 GB 9.99 EUR/month, Teams per user, with a 14-day free trial, so the app is free and the sync service is optional paid. App UI: packages/lib/locales/index.js in laurent22/joplin lists 39 locales (e.g. es_ES, de_DE, fr_FR, pt_BR, zh_CN), translation completeness varies (fr_FR 100%, es_ES/de_DE/pt_BR 81%, zh_CN 80% in the stats file). License shown as non-standard in GitHub metadata, so not stated.'}
