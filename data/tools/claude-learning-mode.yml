verified: {date: '2026-10-21', method: official-site, notes: 'Re-checked 2026-10-21. claude.com/solutions/education: ''Claude''s learning mode works like a good tutor''; anthropic.com/news/introducing-claude-for-education (Apr 2, 2025): Learning mode introduced as part of Claude for Education, works within Projects, get started by sharing interest with the education team. claude.com/pricing: Free plan $0 and Claude Code listed as No on Free / Yes on Pro and Max; learning mode appears only under the higher-education plan (contact sales). Claude Code docs list a built-in Learning output style. Whether individual Free or Pro users can use the chat learning mode was not found on any official page, so price stays unverified.'}
