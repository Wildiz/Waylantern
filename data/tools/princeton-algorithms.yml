verified: {date: 2026-10-21, method: official-site, notes: "Booksite home: 'Everything on these pages is freely available', links 'our free Coursera MOOCs' Parts I and II and CUbits certificate courses (cost not checked). Coursera course pages (algorithms-part1, algorithms-part2) FAQ: 'Do I need to pay for this course? No. All features of this course are available for free.' and no certificates are awarded per Princeton policy; Part I page lists 26 languages for subtitles/translations, primary language en. The earlier con about the textbook being free only at participating institutions was not found on the booksite home page and was replaced."}
