verified: {date: '2026-10-21', method: github-repo, notes: 'habitica.com meta description calls it a free habit and productivity app; GitHub LICENSE is GPL v3; API status endpoint reports up (v5.51.0). HabitRPG/habitica (raw files, 2026-10-21): subscriptionBlocks.js defines optional paid user subscriptions (1/3/6/12 months, USD 5 for 1 month) and a paid group plan; en/subscriber.json lists subscriber perks (Gold-purchasable Gems, double drops, exclusive gear, Mystic Hourglass); en/faq.json says Group Plans are a paid feature while Challenges are free to everyone. website/common/locales has translated files for es, es_419, de, fr, pt_BR (full language list not enumerated). README: pull requests paused since Aug 4, 2026. Price freemium.'}
