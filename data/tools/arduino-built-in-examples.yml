  notes: "Read arduino/docs-content main README.md, LICENSE.md and content/built-in-examples/01.basics/Blink/Blink.md via raw.githubusercontent.com. The tutorial marks difficulty beginner, lists an Arduino board as required hardware, and explains the onboard LED, optional external LED and resistor, LED_BUILTIN, digitalWrite and delay. README and the full LICENSE.md identify CC BY-SA 4.0; the license file's introductory link label omits ShareAlike, but its linked target and full text include it. Hosted docs.arduino.cc access returned a proxy denial, so this entry links the verified source. Free refers to reading the tutorial, not hardware. English checked; no circuit was built or code executed."
