verified: {date: '2026-10-21', method: github-repo, notes: 'GitHub: siyuan-note/siyuan, ~46.9k stars, AGPL-3.0, last push 2026-10-21. README: most features free incl. commercial use, some features need paid membership; pricing page read 2026-10-21 (b3log.org/siyuan/en/pricing.html): Free = local storage, completely free $0; PRO Features one-time (third-party S3 and WebDAV sync and backup; no storage included), page shows $64 with $96 alongside; Subscription with 8 GB official cloud storage, official sync and cloud inbox, page shows $148 with $296 alongside (which figure is the current price was not clear from the text); no refunds, trial available in the desktop app. README in en, zh, ja, tr; Docker UI language values include en, zh-CN, zh-TW, ja, pt-BR.'}
