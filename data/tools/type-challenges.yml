  notes: "Read the official README.md, MIT LICENSE, questions/00004-easy-pick/README.md and its test-cases.ts via raw.githubusercontent.com. Pick asks learners to implement the built-in generic and includes type assertions plus an invalid-key case. README specifies strict mode and links a browser Playground. Free refers to the MIT-licensed challenge material; English content checked. Focus rating reflects short tasks and type-checker feedback. No exercise or Playground was executed."
