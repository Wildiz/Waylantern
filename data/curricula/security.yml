group: security
curricula:
- role: cybersecurity-practitioner
  title: Cybersecurity Practitioner learning recipe
  summary: An editorial introduction to protecting a small system and choosing a defensive specialization;
    not a complete occupational qualification.
  entry_level: from-zero
  prerequisites:
  - Basic file handling and a disposable local practice environment.
  outcome: A documented security review of a small practice system, including assets, controls, test evidence
    and remaining risks.
  stages:
  - title: Learn systems and security language
    topics:
    - Accounts, processes and file permissions
    - IP networking and confidentiality, integrity and availability
    resources:
    - the-linux-command-line
    - professor-messer
    practice: Draw how a browser, network, server and account connect, then list the information each
      holds.
    checkpoint: You can trace one login and identify three assets and their owners.
  - title: Apply small preventive controls
    topics:
    - Least privilege and patching
    - Backup, recovery and change records
    resources:
    - linux-upskill-challenge
    practice: Create a nonprivileged practice account, document access permissions and restore a harmless
      test file from a backup.
    checkpoint: Your evidence shows the account permissions and a successful file restore, with undo steps.
  - title: Observe and investigate
    topics:
    - Authentication events and timestamps
    - Triage, uncertainty and escalation
    resources:
    - wireshark
    practice: Generate a failed login on your own lab and compare its log record with a short authorized
      traffic capture.
    checkpoint: A timeline distinguishes what the records demonstrate from what remains unknown.
  - title: Complete a scoped security review
    topics:
    - Risk prioritization and remediation
    - Communicating findings and choosing a specialization
    resources: []
    practice: Combine the asset list, two control tests and one investigation into a short report; propose
      a follow-up in monitoring, administration or assurance.
    checkpoint: The report includes reproducible evidence, prioritized actions, owners and an explicit
      statement of scope.
    gap: No complete general-practitioner curriculum or assessment rubric has been verified; this review
      is an editorial exercise.
  next_steps: Repeat the review on another authorized lab, seek feedback on your evidence and choose one
    specialist recipe rather than treating this introduction as professional certification.
- role: penetration-tester
  title: Penetration Tester learning recipe
  summary: A scoped progression from web and network fundamentals to an authorized lab assessment and
    retest.
  entry_level: after-basics
  prerequisites:
  - Basic HTTP and networking knowledge.
  - Comfort using a terminal and reading simple code.
  outcome: A reproducible report for a deliberately vulnerable lab, including boundaries, impact, fixes
    and a retest.
  stages:
  - title: Understand the system and permission boundary
    topics:
    - HTTP requests, authentication and sessions
    - Written scope, test rules and safe stopping conditions
    resources:
    - professor-messer
    - owasp-top-10
    practice: Diagram a locally hosted practice application and write a test agreement covering only that
      lab.
    checkpoint: The agreement names allowed targets, excluded actions and conditions for stopping.
  - title: Reproduce a guided web weakness
    topics:
    - Input handling and access control
    - Observations versus assumptions
    resources:
    - portswigger-web-security-academy
    practice: Complete an available introductory lab within its authorized environment and record each
      request and response needed to reproduce the issue.
    checkpoint: Another learner can reproduce the lab outcome from your notes without guessing missing
      steps.
  - title: Assess a small application deliberately
    topics:
    - Coverage and repeatable test cases
    - Impact, remediation and evidence handling
    resources:
    - owasp-juice-shop
    practice: Select two permitted challenges in a private local lab; keep a coverage checklist and avoid
      collecting unrelated data.
    checkpoint: Each finding has evidence, a bounded impact explanation and a proposed fix; untested coverage
      is explicit.
  - title: Deliver and retest
    topics:
    - Clear reporting and residual risk
    - Verification of remediation
    resources: []
    practice: Write an executive summary and technical appendix; apply or simulate one lab remediation
      and repeat the original test.
    checkpoint: The final report separates confirmed findings, limitations and retest results, with authorization
      attached.
    gap: No comprehensive penetration-testing engagement standard or supervisor-reviewed assessment has
      been verified in this catalogue.
  next_steps: Have an experienced tester review your lab report and broaden practice only through systems
    for which testing is explicitly authorized.
- role: soc-analyst
  title: Security Operations Center Analyst learning recipe
  summary: A defensive monitoring recipe focused on alert triage, evidence correlation and escalation
    rather than exploitation.
  entry_level: after-basics
  prerequisites:
  - Basic networking and operating-system knowledge.
  - Ability to read timestamps and simple log records.
  outcome: A defensible alert investigation with timeline, evidence references, severity reasoning and
    escalation handoff.
  stages:
  - title: Learn telemetry context
    topics:
    - Network flows and authentication records
    - Assets, normal behavior and time zones
    resources:
    - professor-messer
    - wireshark
    practice: Inspect a capture of your own benign web request and create a glossary of the fields you
      can explain.
    checkpoint: You can connect a flow to an endpoint and state what encrypted traffic does not reveal.
  - title: Triage an alert
    topics:
    - False positives and prioritization
    - Ownership, scope and duplicate events
    resources: []
    practice: Use synthetic login events to compare a mistaken password with repeated failures followed
      by success; fill in a triage worksheet.
    checkpoint: Your worksheet records supporting and conflicting evidence without labeling every failure
      an attack.
    gap: No specific SIEM triage course has been verified; synthetic events provide a local exercise,
      not product training.
  - title: Correlate evidence
    topics:
    - Event ordering and investigative hypotheses
    - Host and network evidence limitations
    resources:
    - cyberdefenders
    practice: Choose an accessible defensive investigation lab after checking its current price and availability;
      otherwise use your synthetic dataset and an authorized capture.
    checkpoint: The timeline cites original evidence and explains why each hypothesis is supported or
      rejected.
  - title: Produce an operational handoff
    topics:
    - Severity rationale and containment recommendations
    - Case notes and analyst review
    resources: []
    practice: Create an incident candidate with a timeline, affected assets, confidence, recommended next
      steps and a handoff checklist.
    checkpoint: A reviewer can continue the case without reconstructing the investigation; containment
      recommendations require the appropriate authorization.
    gap: No end-to-end SOC operating procedure or assessed analyst qualification has been verified; adapt
      the editorial handoff to a real team under supervision.
  next_steps: Obtain feedback on a second case, then learn the telemetry and escalation procedures of
    a supervised SOC environment.
- role: soc-service-desk-analyst
  title: SOC Service Desk Analyst learning recipe
  summary: A security request intake and escalation recipe, emphasizing careful communication and useful
    tickets.
  entry_level: from-zero
  prerequisites:
  - Basic computer use and clear written communication.
  outcome: A set of sanitized security intake tickets with correct routing, urgency and handoff details.
  stages:
  - title: Recognize requests and security signals
    topics:
    - Accounts, phishing reports and suspicious activity
    - Confidentiality and minimum necessary information
    resources:
    - professor-messer
    practice: Sort six fictional reports into routine support, security review or immediate escalation,
      explaining each choice.
    checkpoint: Your classifications distinguish observed events from the reporter's interpretation.
  - title: Record an actionable ticket
    topics:
    - Required fields and asset identification
    - Timestamps, contact details and sensitive data minimization
    resources:
    - glpi
    practice: Use a disposable ticket lab or a local template to record the reports without passwords
      or real personal information.
    checkpoint: Every ticket names the symptom, time, affected asset, source of the report and missing
      information.
  - title: Route and communicate
    topics:
    - Escalation criteria and ownership
    - Acknowledgement and user-safe instructions
    resources: []
    practice: Create an editorial routing matrix for a locked account, a phishing report and a suspected
      compromised device; draft acknowledgement messages.
    checkpoint: Each route has an owner and an urgent fallback; messages do not ask users to transmit
      credentials or investigate malware.
    gap: No organization-specific security service-desk procedure has been verified; routing and response
      expectations here are simulated.
  - title: Run an intake tabletop
    topics:
    - Handover completeness and queue review
    - Closure evidence and reopening conditions
    resources: []
    practice: Role-play intake for three reports, then hand the tickets to another learner and revise
      fields they cannot understand.
    checkpoint: The final ticket packet includes complete handoffs, an escalation record and a closure
      or pending reason for each case.
    gap: No assessed SOC service-desk curriculum has been verified; this tabletop tests documentation
      and coordination only.
  next_steps: Practise under a team's approved intake process, then study SOC investigation if you want
    responsibility for analyzing the escalated cases.
- role: security-operations-manager
  title: Security Operations Manager learning recipe
  summary: A management-level recipe for coordinating monitoring and response, staffing coverage and measurable
    service improvement.
  entry_level: experience-required
  prerequisites:
  - Experience handling operational security cases.
  - Experience with escalation, incident coordination and team handoffs.
  - Ability to discuss staffing and service responsibilities with stakeholders.
  outcome: A reviewed operating plan with coverage, decision rights, quality measures and an incident
    exercise report.
  stages:
  - title: Review the operating model
    topics:
    - Monitoring scope and dependencies
    - Decision rights and service expectations
    resources: []
    practice: Map a fictional SOC's stakeholders, data dependencies, escalation authority and out-of-hours
      coverage.
    checkpoint: The map distinguishes analyst decisions, managerial decisions and actions requiring business
      approval.
    gap: No complete security-operations management curriculum has been verified; use an experienced supervisor
      to review the operating model.
  - title: Define quality and capacity measures
    topics:
    - Alert demand and investigation quality
    - Workload, coverage and training gaps
    resources: []
    practice: Create a synthetic weekly queue and compare workload, case age and review quality; identify
      misleading metrics.
    checkpoint: Your analysis proposes capacity changes and explains why raw closure counts cannot establish
      effectiveness.
    gap: No verified staffing model or service-level benchmark is provided; all queue data and targets
      are editorial examples.
  - title: Coordinate an incident exercise
    topics:
    - Incident roles and communication cadence
    - Evidence preservation and stakeholder decisions
    resources: []
    practice: Run a tabletop around a suspected account compromise using fictional logs, a decision log
      and a communications plan.
    checkpoint: The exercise records decision owners, escalation times, unresolved risks and an approved
      communication route.
    gap: No incident-command curriculum or organization-approved playbook has been verified; this is a
      simulated coordination exercise.
  - title: Deliver an improvement plan
    topics:
    - Prioritization, resourcing and accountability
    - Review cycles and lessons learned
    resources: []
    practice: Combine the operating model, workload analysis and tabletop findings into a plan with owners
      and measurable review points.
    checkpoint: A reviewer can trace each proposed change to evidence, a resource assumption and a way
      to evaluate its outcome.
    gap: This editorial capstone does not substitute for supervised security-operations management experience.
  next_steps: Review the plan with experienced security and operations leaders; validate assumptions against
    a real team before adopting staffing or response targets.
- role: cybersecurity-technician
  title: Cybersecurity Technician learning recipe
  summary: A hands-on defensive setup recipe for accounts, updates, logs and recovery on a disposable
    practice system.
  entry_level: after-basics
  prerequisites:
  - Basic operating-system and network concepts.
  - A disposable local Linux practice system.
  outcome: A documented baseline configuration with tested controls, log observations and a rollback record.
  stages:
  - title: Establish the baseline
    topics:
    - Inventory, versions and service exposure
    - Routine maintenance versus incidents
    resources:
    - linux-upskill-challenge
    - professor-messer
    practice: Record installed services, account types and pending updates on your own lab before changing
      anything.
    checkpoint: The baseline identifies what runs, who administers it and how to restore the initial state.
  - title: Configure access carefully
    topics:
    - Least privilege and permissions
    - Change approval and rollback
    resources:
    - the-linux-command-line
    practice: Create separate practice accounts, limit a test directory and record before-and-after permissions.
    checkpoint: A normal account can perform its intended task but cannot read the restricted test file.
  - title: Verify protection and recovery
    topics:
    - Updates and configuration checks
    - Logs and recoverable backups
    resources:
    - linux-upskill-challenge
    practice: Apply a routine lab update, verify the affected service and restore a harmless file after
      deletion.
    checkpoint: The record shows successful service checks and restore evidence, plus the logs consulted.
  - title: Assemble the maintenance handoff
    topics:
    - Repeatable checks and exception records
    - Incident escalation and ownership
    resources: []
    practice: Write a technician runbook for the baseline, execute it on a second disposable instance
      or reset lab and record an intentional failed check.
    checkpoint: Another learner can repeat the runbook and route the failed check with sufficient evidence.
    gap: No product-specific endpoint protection or technician assessment has been verified; the capstone
      covers foundational local controls only.
  next_steps: Learn the approved tools and change process of a supervised support or security team before
    operating production controls.
- role: information-security-technician
  title: Information Security Technician learning recipe
  summary: A control-maintenance recipe that connects practical access checks with evidence records and
    exception handling.
  entry_level: after-basics
  prerequisites:
  - Basic administration and file-permission knowledge.
  - Ability to maintain a structured checklist.
  outcome: A small control evidence register showing test steps, results, ownership and unresolved exceptions.
  stages:
  - title: Connect information to control needs
    topics:
    - Information classification and ownership
    - Access, availability and confidentiality
    resources:
    - professor-messer
    practice: Invent a small document-sharing service and identify which information needs restricted
      access and recovery.
    checkpoint: Each information type has an owner and a reason for its proposed controls.
  - title: Test access against the intended policy
    topics:
    - Account lifecycle and permissions
    - Expected versus observed access
    resources:
    - the-linux-command-line
    practice: Create a lab folder with two roles and run permitted and denied access checks using harmless
      sample files.
    checkpoint: Your evidence shows both positive and negative test results, including which account ran
      each check.
  - title: Maintain evidence and exceptions
    topics:
    - Control records and review dates
    - Exception ownership and expiration
    resources: []
    practice: Build a register for access reviews, updates and backups; add a deliberately overdue review
      and an exception with an owner.
    checkpoint: Every record cites test evidence and every exception has a rationale and review condition.
    gap: No verified information-security control register template or specific compliance baseline is
      supplied; this register is an editorial practice artifact.
  - title: Handover a control cycle
    topics:
    - Retesting and evidence integrity
    - Escalation and management reporting
    resources: []
    practice: Repeat the checks after removing one account, compare results and prepare a short handover
      of failures and pending actions.
    checkpoint: A reviewer can trace each reported control status to a dated test and can distinguish
      untested from failed.
    gap: No complete occupational qualification has been verified; this capstone tests disciplined control
      maintenance rather than certification compliance.
  next_steps: Ask a control owner or experienced technician to review the register and practise with an
    organization's actual policies under supervision.
- role: vulnerability-assessor
  title: Vulnerability Assessor learning recipe
  summary: A vulnerability-management recipe for validating weaknesses, prioritizing business exposure
    and checking remediation in authorized labs.
  entry_level: after-basics
  prerequisites:
  - Networking, HTTP and operating-system basics.
  - Ability to work inside a clearly authorized disposable lab.
  outcome: A prioritized vulnerability register with verification evidence, remediation owners and retest
    results.
  stages:
  - title: Understand assets and vulnerability context
    topics:
    - Asset criticality and exposure
    - Weakness categories and authorization
    resources:
    - professor-messer
    - owasp-top-10
    practice: Define a local practice application's assets and permitted assessment scope, then distinguish
      a weakness from confirmed exploitation.
    checkpoint: The scope and inventory state what may be examined and why each asset matters.
  - title: Validate a small set of findings
    topics:
    - Evidence quality and false positives
    - Reproducible non-destructive validation
    resources:
    - portswigger-web-security-academy
    practice: Use an available authorized introductory lab to document one weakness; separately write
      the evidence that would disprove a mistaken finding.
    checkpoint: The finding has a repeatable check and the assessor can explain its limitations without
      claiming broader compromise.
  - title: Prioritize remediation
    topics:
    - Exposure, impact and uncertainty
    - Ownership, compensating controls and exceptions
    resources: []
    practice: Create three synthetic findings with different asset importance and discuss the remediation
      order with a peer.
    checkpoint: Each priority includes a rationale beyond a tool score, an owner and a condition for revisiting
      the decision.
    gap: No scanner curriculum or organization-approved risk-scoring model has been verified; scoring
      examples are editorial and must be adapted.
  - title: Close the assessment loop
    topics:
    - Retesting and residual risk
    - Reporting coverage and overdue action
    resources: []
    practice: Produce a register and review report, then demonstrate a fixed lab condition or document
      a simulated retest separately from real evidence.
    checkpoint: The final package separates verified fixes, pending actions, accepted exceptions and unassessed
      scope.
    gap: No comprehensive vulnerability-management programme has been verified; this recipe provides a
      bounded assessment exercise.
  next_steps: Learn an approved assessment tool in a supervised environment and refine prioritization
    using real asset ownership and remediation processes.
- role: malware-analyst
  title: Malware Analyst learning recipe
  summary: An analysis-method recipe using benign programs and supplied observations before any specialist
    malware-handling practice.
  entry_level: after-basics
  prerequisites:
  - Programming fundamentals and operating-system process concepts.
  - Ability to inspect files without executing unknown content.
  - A disposable, isolated practice environment for your own benign programs.
  outcome: A reproducible behavioral report about a harmless sample, including provenance, observations
    and detection hypotheses.
  stages:
  - title: Learn program and system behavior
    topics:
    - Processes, files and network activity
    - Source code, compiled artifacts and evidence limits
    resources:
    - cs50-python
    - the-linux-command-line
    practice: Write a harmless program that creates a local test file, then describe its expected process
      and file behavior from source.
    checkpoint: You can distinguish the source's intent, an observed action and an inference about behavior.
  - title: Record static observations safely
    topics:
    - File identity, hashes and readable metadata
    - Strings, imports and limits of static indicators
    resources: []
    practice: Inspect your own harmless program or file without launching it; record its hash, origin
      and descriptive features.
    checkpoint: Another learner can identify the exact artifact and reproduce the recorded observations
      without receiving unknown executables.
    gap: No dedicated static-malware-analysis course or verified disassembler guide is catalogued; use
      only benign material you created.
  - title: Compare expected and observed behavior
    topics:
    - Controlled observations and repeatability
    - Network indicators and alternative explanations
    resources:
    - wireshark
    practice: Observe a benign script you wrote inside your disposable lab; compare its actions with your
      predictions and inspect only your own traffic.
    checkpoint: Your record identifies environmental effects and does not treat a string or connection
      as proof of malicious intent.
  - title: Build an analysis report
    topics:
    - Behavior summaries and confidence
    - Defensive hypotheses and further questions
    resources: []
    practice: Produce a case report for the benign sample with provenance, static notes, controlled observations
      and proposed detection checks.
    checkpoint: The report separates measured evidence from hypotheses and explicitly identifies the gap
      before handling real malware.
    gap: Specialist malware containment, reverse engineering and legal handling remain unverified training
      gaps; this capstone does not authorize handling live malware.
  next_steps: Seek a supervised specialist programme covering safe sample acquisition, containment and
    reverse engineering before working with real malware.
- role: it-auditor
  title: IT Auditor learning recipe
  summary: An assurance recipe for testing technology controls against explicitly selected criteria and
    documenting defensible findings.
  entry_level: after-basics
  prerequisites:
  - Basic IT operations and account-management concepts.
  - Ability to read policies and keep evidence organized.
  outcome: A mock IT audit workpaper packet with criteria, sampling rationale, evidence and reviewed findings.
  stages:
  - title: Understand systems and audit scope
    topics:
    - IT processes and control ownership
    - Audit objectives, independence and criteria
    resources:
    - professor-messer
    practice: Map a fictional user-access process and agree a narrow audit objective with a peer acting
      as the process owner.
    checkpoint: The scope identifies the process, period, criteria and exclusions without claiming compliance
      with an unreviewed standard.
  - title: Design control tests
    topics:
    - Control design versus operation
    - Population, sample selection and evidence requests
    resources: []
    practice: Write an editorial access-approval criterion and test plan, then create synthetic account-request
      and approval records.
    checkpoint: The plan explains which evidence would support the conclusion and how the sample was chosen.
    gap: No verified IT audit methodology or professional auditing standard has been catalogued; criteria
      and sampling here are practice examples.
  - title: Evaluate evidence and findings
    topics:
    - Traceability and contradictory evidence
    - Condition, criterion, cause and consequence
    resources: []
    practice: Compare the synthetic records with your criterion; document one passing case, one exception
      and one case with insufficient evidence.
    checkpoint: Each conclusion cites the exact record and distinguishes a deviation from an inability
      to test.
    gap: No formal assurance opinion or standard-specific interpretation is supported by the current catalogue.
  - title: Deliver an auditable workpaper packet
    topics:
    - Finding review and management response
    - Remediation follow-up and file organization
    resources: []
    practice: Assemble the scope, test plan, evidence index and findings, then have a peer challenge the
      conclusions and revise them.
    checkpoint: A reviewer can trace findings to tests, see limitations and identify owners for follow-up
      without reopening undocumented assumptions.
    gap: This editorial audit simulation is not a professional audit qualification or a real assurance
      engagement.
  next_steps: Study the audit methodology and criteria actually used by an employer with a qualified supervisor
    before performing real assurance work.
- role: information-security-analyst
  title: Information Security Analyst learning recipe
  summary: A risk-analysis recipe linking a small information service to feasible controls, evidence and
    reassessment.
  entry_level: after-basics
  prerequisites:
  - Basic security and system concepts.
  - Ability to explain a business process in plain language.
  outcome: An evidence-based risk assessment for a fictional service with treatment choices and a review
    plan.
  stages:
  - title: Model the information service
    topics:
    - Information flows, ownership and dependencies
    - Threats, weaknesses and consequences
    resources:
    - professor-messer
    - owasp-top-10
    practice: Diagram a fictional appointment service using only invented information; mark trust boundaries
      and business dependencies.
    checkpoint: You can explain how one weakness might affect confidentiality, integrity or availability
      without treating the risk as a confirmed incident.
  - title: Assess plausible risks
    topics:
    - Likelihood assumptions and impact
    - Evidence quality and uncertainty
    resources: []
    practice: Write three risk scenarios and list what evidence would strengthen or weaken each estimate.
    checkpoint: Each scenario connects a cause, an event and a business consequence; uncertainty is recorded.
    gap: No verified organization-specific risk methodology is provided; the risk scenarios and ratings
      are editorial exercises.
  - title: Select and test a control
    topics:
    - Risk treatment and ownership
    - Control effectiveness and remaining exposure
    resources:
    - linux-upskill-challenge
    practice: Choose one lab access or backup control related to a scenario and compare its expected protection
      with a small reproducible test.
    checkpoint: The control recommendation states what the test demonstrates and what it cannot prevent.
  - title: Communicate the assessment
    topics:
    - Priorities and decision records
    - Monitoring indicators and reassessment triggers
    resources: []
    practice: Create a short assessment with risk scenarios, test evidence, owners, treatment options
      and a review trigger for each decision.
    checkpoint: A nontechnical reviewer can identify what decision is requested, its assumptions and the
      remaining risk.
    gap: No profession-specific information-security analyst curriculum or assessment has been verified;
      this is a bounded editorial capstone.
  next_steps: Have an experienced analyst review your assumptions, then learn the risk and control processes
    of a supervised organization.
- role: information-security-compliance-consultant
  title: Information Security Compliance Consultant learning recipe
  summary: A security-obligation mapping recipe that separates an actual requirement from a suggested
    control or an unsupported compliance claim.
  entry_level: after-basics
  prerequisites:
  - Basic security-control knowledge.
  - Ability to read scoped requirements and distinguish evidence from assertions.
  outcome: A mock security-obligation matrix with evidence requests, gaps, responsible owners and clearly
    bounded conclusions.
  stages:
  - title: Understand security-control context
    topics:
    - Policies, controls and assurance evidence
    - Requirement scope and applicability
    resources:
    - professor-messer
    practice: Describe a fictional service and its information types, then list which parties would need
      to decide its obligations.
    checkpoint: You distinguish a legal question requiring qualified advice from a technical control question.
  - title: Translate an agreed requirement
    topics:
    - Requirement wording and applicability
    - Control objectives and evidence mapping
    resources: []
    practice: Use three explicitly fictional contractual security clauses to create an obligation-to-control
      matrix.
    checkpoint: Each row retains the exact practice clause and explains the proposed evidence without
      inventing a standard citation.
    gap: Current laws, security standards and jurisdiction-specific interpretations have not been verified;
      fictional clauses are used only to practise mapping.
  - title: Review evidence and gaps
    topics:
    - Sufficient evidence and limitations
    - Exceptions, remediation and validation
    resources: []
    practice: Review synthetic access-review and backup records against the mock clauses; distinguish
      absent evidence from proven failure.
    checkpoint: The gap register identifies the requirement, evidence reviewed, limitation, owner and
      next verification action.
    gap: No verified certification or security-compliance audit methodology is provided; do not issue
      compliance claims from this exercise.
  - title: Present a bounded advisory report
    topics:
    - Stakeholder communication and change monitoring
    - Action tracking and review decisions
    resources: []
    practice: Deliver the mapping and gap register with a plain-language summary, assumptions and a plan
      for rechecking obligations.
    checkpoint: A reviewer can identify exactly which fictional clauses were assessed and which conclusions
      remain unsupported.
    gap: This editorial consultation simulation is not legal advice, accreditation or an attestation of
      compliance.
  next_steps: Select the real contractual, regulatory or standard context with a qualified specialist
    and verify its current primary sources before advising clients.
- role: security-assessment-auditor
  title: Security Assessment Auditor learning recipe
  summary: An assessment recipe for evaluating whether security controls meet agreed criteria and whether
    evidence supports the conclusion.
  entry_level: after-basics
  prerequisites:
  - Basic security-control and IT process knowledge.
  - Familiarity with evidence handling and professional independence.
  outcome: A mock security assessment containing a test matrix, reproducible checks and a reviewed conclusion
    with limitations.
  stages:
  - title: Define the assessment boundary
    topics:
    - System scope and evidence owners
    - Criteria, independence and permitted tests
    resources:
    - professor-messer
    practice: Define a fictional file-sharing system, the control owners and three editorial assessment
      criteria.
    checkpoint: The assessment plan states which claims will be tested and does not substitute a vulnerability
      scan for an assurance conclusion.
  - title: Design evidence-based assessment procedures
    topics:
    - Design assessment and operational testing
    - Samples, interviews and technical evidence
    resources: []
    practice: Create test steps for account approvals, access removal and backup recovery using invented
      records.
    checkpoint: Each procedure states its expected result and the evidence needed to establish it.
    gap: No particular assessment framework, approved control catalogue or assessor methodology has been
      verified; the criteria are editorial practice material.
  - title: Test a control and reconcile evidence
    topics:
    - Positive and negative test cases
    - Exceptions and alternative explanations
    resources:
    - the-linux-command-line
    practice: Test a local practice folder's access restrictions and compare the actual result with a
      fictional access policy and approval record.
    checkpoint: The workpaper links policy intent, observed behavior and any contradiction, with the account
      and test date recorded.
  - title: Review and report the assessment
    topics:
    - Conclusion scope and evidence traceability
    - Finding validation and follow-up
    resources: []
    practice: Assemble the plan, procedures and workpapers; have a peer dispute one finding and record
      how you resolve the challenge.
    checkpoint: The conclusion names the criteria and limitations, and every finding can be traced to
      evidence rather than an unsupported compliance label.
    gap: No formal assurance opinion or assessor qualification is established by this editorial assessment
      exercise.
  next_steps: Obtain supervised experience applying the actual assessment framework required by an engagement
    and verify its current authoritative criteria.
