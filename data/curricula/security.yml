      risk.
    checkpoint: The responsibility map avoids making the security team the owner of every business decision.
  - title: Write an implementable policy
    topics:
    - Objectives, scope and exceptions
    - Clear requirements and control ownership
    resources: []
    practice: Draft a short editorial access-management policy with measurable requirements and an exception
      process.
    checkpoint: Each requirement names an accountable owner and a practical way to check implementation.
    gap: No verified security-management standard or organization-approved policy framework is supplied;
      this is a practice policy.
  - title: Track treatments and control evidence
    topics:
    - Risk-treatment decisions and dependencies
    - Control reviews and overdue exceptions
    resources: []
    practice: Create a synthetic register linking three risks to policy requirements, evidence checks,
      owners and review conditions.
    checkpoint: The register separates accepted risk, pending treatment and missing evidence rather than
      reporting all items as resolved.
    gap: No formal management-system certification criteria have been verified; the register is not proof
