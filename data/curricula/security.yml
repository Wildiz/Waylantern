- role: security-administrator
  title: Security Administrator learning recipe
  summary: An operational recipe for configuring access, maintaining a secure baseline and verifying changes
    in a disposable practice system.
  entry_level: after-basics
  prerequisites:
  - Basic Linux administration and networking knowledge.
  - A disposable system where you can test and roll back configuration changes.
  outcome: A tested access and configuration runbook with baseline evidence, rollback instructions and
    incident handoff details.
  stages:
  - title: Document system and administration boundaries
    topics:
    - Accounts, services and exposure
    - Administrative authority and baseline configuration
    resources:
    - linux-upskill-challenge
    - professor-messer
    practice: Inventory a practice server and record service owners, accounts and network-facing services
      before changing settings.
    checkpoint: The baseline shows what is authorized, what must remain available and how to recover the
      initial state.
  - title: Manage access through a lifecycle
    topics:
    - Provisioning, least privilege and removal
    - Permission testing and change records
    resources:
    - the-linux-command-line
    practice: Create two practice roles, test allowed and denied file access, then remove one account's
      access.
    checkpoint: Recorded positive and negative checks demonstrate both provisioning and revocation without
      relying on a screenshot alone.
  - title: Maintain and monitor the baseline
    topics:
    - Updates, service checks and backups
    - Log review and exception escalation
    resources:
    - linux-upskill-challenge
    practice: Perform a documented lab maintenance change, verify service health and review the relevant
      logs; test recovery of a harmless file.
    checkpoint: The change record contains before-and-after results, a working rollback and a separate
      record for unresolved checks.
  - title: Deliver an operational runbook
    topics:
    - Repeatability and safe failure handling
    - Evidence handoff and periodic review
    resources: []
    practice: Have another learner follow your runbook on a reset lab, including an intentional permission
      failure and its escalation ticket.
    checkpoint: The learner can reproduce the baseline, recognize the failed check and hand it off with
      logs and a clear rollback decision.
    gap: No product-specific identity, endpoint or security-appliance administration curriculum has been
      verified; learn approved vendor procedures before administering such systems.
  next_steps: Practise with an experienced administrator and learn the organization's approved tools,
    change controls and recovery requirements before handling production security settings.
