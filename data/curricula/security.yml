- role: digital-forensics-examiner
  title: Digital Forensics Examiner learning recipe
  summary: A preservation-first recipe using learner-created evidence to practise provenance, repeatability
    and limited conclusions.
  entry_level: after-basics
  prerequisites:
  - File-system and operating-system fundamentals.
  - Ability to work with copies and record commands.
  - A disposable lab and only evidence you own or are authorized to examine.
  outcome: A reproducible examination report for a benign self-created evidence set with an integrity
    and handling record.
  stages:
  - title: Understand evidence and examination scope
    topics:
    - File metadata and timestamps
    - Authority, privacy and preservation
    resources:
    - the-linux-command-line
    - professor-messer
    practice: Create harmless sample files in your own lab and write a narrow examination question and
      a list of authorized sources.
    checkpoint: The plan states the evidence boundary and why ordinary use could change some metadata.
  - title: Preserve and document a working copy
    topics:
    - Integrity hashes and provenance
    - Handling records and original versus working copies
    resources: []
    practice: Copy the benign files, compute hashes with an appropriate local utility and record every
      transfer and examination action.
    checkpoint: The record identifies the original and working copy and detects a deliberate change to
      one copied file.
    gap: No verified forensic acquisition, write-blocking or chain-of-custody training is supplied; copying
      files here is not a forensic disk acquisition.
  - title: Examine and build a cautious timeline
    topics:
    - Metadata interpretation and time zones
    - Corroboration and alternative explanations
    resources:
    - wireshark
    practice: Use your self-generated files and an authorized saved capture to build a small timeline;
      compare known actions with recorded timestamps.
    checkpoint: The timeline cites each source and explains why an isolated timestamp does not prove who
      performed an action.
  - title: Report a reproducible examination
    topics:
    - Methods, limitations and integrity checks
    - Clear answers to the examination question
    resources: []
    practice: Produce an evidence index, handling log, methods appendix and report answering only the
      initial benign examination question.
    checkpoint: A peer can repeat the examination from the working copy and identify every inference and
      limitation.
    gap: Specialist device acquisition, deleted-file recovery and legal evidentiary requirements remain
      unverified gaps; no courtroom admissibility is claimed.
  next_steps: Pursue supervised specialist training in acquisition and the applicable legal context before
    examining real case material; confirm defensive lab access and cost separately.
- role: compliance-consultant
  title: Compliance Consultant learning recipe
  summary: A general compliance-advisory recipe for scoping obligations, tracing evidence and communicating
    limitations in a fictional technology service.
  entry_level: after-basics
  prerequisites:
  - Clear analytical writing and familiarity with basic organizational processes.
  - Ability to distinguish factual observations from legal or contractual interpretation.
  outcome: A mock obligation register and advisory report that distinguish verified practice evidence
    from questions for qualified advice.
  stages:
  - title: Map the organization and obligation sources
    topics:
    - Business processes and decision owners
    - Laws, contracts, policies and scope
    resources: []
    practice: Create a fictional online service and identify which stakeholders would determine its jurisdictions,
      contractual duties and internal policies.
    checkpoint: Your map identifies unknown applicability decisions rather than guessing legal requirements.
    gap: No jurisdiction-specific compliance course or current legal source has been verified; this role
      requires context beyond the catalogue.
  - title: Build an obligation register
    topics:
    - Exact requirement wording and interpretation
    - Responsibility and evidence requests
    resources: []
    practice: Invent three clearly labeled practice contract clauses and map each to an owner, process
      and possible evidence.
    checkpoint: A peer can trace each proposed test to the original fictional clause without confusing
      it with a law.
    gap: The clauses are editorial examples, not actual regulatory requirements or legal advice.
  - title: Evaluate practice against requirements
    topics:
    - Evidence reliability and contradictions
    - Gap severity, uncertainty and remediation
    resources: []
    practice: Review synthetic records for the fictional service, then document compliant-looking cases,
      gaps and inconclusive cases separately.
    checkpoint: Every conclusion states the evidence and what remains untested; proposed actions have
      owners.
    gap: No compliance assessment or certification methodology has been verified; conclusions apply only
      to the fictional exercise.
  - title: Deliver and maintain advice
    topics:
    - Plain-language communication
    - Change tracking and reassessment triggers
    resources: []
    practice: Write a bounded advisory report and a process for rechecking applicability when the service
      or its contracts change.
    checkpoint: The report names assumptions, open legal questions and follow-up actions without asserting
      real compliance.
    gap: A qualified specialist must verify the actual current obligations before this workflow is used
      for real advice.
  next_steps: Choose an industry and jurisdiction, obtain qualified supervision and verify current primary
    sources before making professional compliance recommendations.
- role: security-management-specialist
  title: Security Management Specialist learning recipe
  summary: A governance and coordination recipe connecting policies, accountable risk treatments and measurable
    control reviews.
