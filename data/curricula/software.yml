group: software
curricula:
- role: software-engineer
  title: Software Engineer
  summary: Turn a small requirement into tested, maintainable software.
  entry_level: from-zero
  prerequisites:
  - Basic file and folder skills
  - A computer that can run Python
  outcome: A command-line study tracker with saved data, tests and reproducible instructions.
  stages:
  - title: Write a small program
    topics:
    - Variables and types
    - Conditions and loops
    - Functions
    resources:
    - cs50-python
    practice: Record a study session and calculate its total minutes.
    checkpoint: Run three inputs and explain how the program computes each total.
  - title: Preserve structured records
    topics:
    - Lists and dictionaries
    - File input and output
    - Validation
    resources:
    - python-tutorial
    practice: Save sessions in JSON and reject negative durations and empty subjects.
    checkpoint: Restart the program and recover the saved sessions while invalid records remain rejected.
  - title: Check changes systematically
    topics:
    - Unit tests
    - Exceptions
    - Version control
    resources:
    - pytest-getting-started
    - pro-git
    practice: Separate calculations from input/output and test empty, valid and invalid records.
    checkpoint: Demonstrate a regression test failing before a fix and passing afterward.
  - title: Deliver the tracker mini-project
    topics:
    - Module boundaries
    - Documentation
    - Regression checks
    resources:
    - python-tutorial
    - pytest-getting-started
    practice: Deliver sample data, setup instructions and a documented limitation with the tracker.
    checkpoint: Follow the README in a fresh folder and reproduce the sample totals and test results.
  next_steps: Study data structures and software design next; Senior and Principal describe responsibilities and
    experience, not separate beginner courses.
- role: frontend-developer
  title: Frontend Developer
  summary: Build an accessible browser interface before introducing frameworks.
  entry_level: from-zero
  prerequisites:
  - Basic file skills
  - A browser and text editor
  outcome: A responsive study planner with keyboard-operable controls and a browser test.
  stages:
  - title: Structure a task interface
    topics:
    - Semantic HTML
    - Labels and forms
    resources:
    - mdn-web-docs
    practice: Create a planner page with headings, a labelled task field and a task list.
    checkpoint: Reach and submit the form using only the keyboard and explain its document structure.
  - title: Adapt the layout
    topics:
    - CSS layout
    - Responsive design
    - Visible focus
    resources:
    - web-dev-learn
    practice: Style the planner for narrow and wide windows while preserving visible focus.
    checkpoint: Check both widths without horizontal overflow and reach every control by keyboard.
  - title: Handle state and events
    topics:
    - DOM updates
    - Event handlers
    - Input validation
    resources:
    - javascript-info
    practice: Add, complete and filter tasks with a small JavaScript state model.
    checkpoint: Demonstrate empty, invalid and populated states without console errors.
  - title: Deliver the interface mini-project
    topics:
    - Browser assertions
    - Accessibility checks
    - Local setup
    resources:
    - playwright-getting-started
    - mdn-web-docs
    practice: Add a browser test for creating a task and document how to run the planner locally.
    checkpoint: Reproduce the task workflow with mouse and keyboard and show the automated result.
  next_steps: Compare a framework only after explaining the state and events in the interface you can already build.
- role: backend-developer
  title: Backend Developer
  summary: Build a service with explicit data rules and testable API responses.
  entry_level: after-basics
  prerequisites:
  - Python functions and modules
  - Basic terminal use
  - Basic Git
  outcome: A local inventory API with SQLite persistence, validation and API tests.
  stages:
  - title: Specify an API contract
    topics:
    - HTTP methods
    - Status codes
    - Request schemas
    resources:
    - mdn-web-docs
    - fastapi-tutorial
    practice: Define create, list and update inventory operations and implement an in-memory endpoint.
    checkpoint: Send valid and invalid requests and explain their different responses.
  - title: Store consistent records
    topics:
    - SQL queries
    - Keys and constraints
    - Transactions
    resources:
    - sqlbolt
    - db-browser-for-sqlite
    practice: Create an inventory table with unique IDs and document the rejected-duplicate case.
    checkpoint: Restart the service and recover records while preserving the uniqueness rule.
  - title: Separate and test business rules
    topics:
    - Dependency boundaries
    - Error handling
    - API tests
    resources:
    - fastapi-tutorial
    - pytest-getting-started
    practice: Test stock calculations separately and return consistent errors for absent records.
    checkpoint: Cover successful updates, missing items and invalid quantities in tests.
  - title: Deliver the service mini-project
    topics:
    - Configuration
    - Initialization
    - Reproducible requests
    resources:
    - fastapi-tutorial
    - pytest-getting-started
    practice: Deliver synthetic fixtures, setup instructions and representative API requests.
    checkpoint: Initialize a fresh local database and reproduce the documented stock changes.
  next_steps: Study authorization, migrations and concurrency in a controlled lab before exposing a service to real
    users.
- role: full-stack-developer
  title: Full Stack Developer
  summary: Connect a browser workflow to a service and database while keeping their responsibilities clear.
  entry_level: after-basics
  prerequisites:
  - Basic JavaScript and HTML
  - Basic Python
  - HTTP and Git basics
  outcome: A reading-list application with browser interaction, server validation and persistent records.
  stages:
  - title: Trace a complete user action
    topics:
    - User journey
    - Browser and server boundaries
    - Data flow
    resources:
    - mdn-web-docs
    - open-practice-library
    practice: Diagram adding a book from the form through server validation to storage, then build the static form.
    checkpoint: Identify which layer displays results, validates records and persists them.
  - title: Build the server slice
    topics:
    - Models and records
    - Server validation
    - Request handling
    resources:
    - django-tutorial
    practice: Create the reading-list model and a server-backed list using the tutorial structure.
    checkpoint: Submit a book, reload the application and retrieve its stored data.
  - title: Connect interactive feedback
    topics:
    - Client requests
    - Loading and error states
    - Accessible status messages
    resources:
    - javascript-info
    - mdn-web-docs
    practice: Add a browser interaction that reports submission status and preserves input when a request fails.
    checkpoint: Demonstrate a successful request and a simulated error without losing the typed title.
  - title: Deliver an end-to-end mini-project
    topics:
    - Browser tests
    - Test fixtures
    - Reproducible setup
    resources:
    - playwright-getting-started
    - pytest-getting-started
    practice: Deliver an add-and-complete-book workflow with synthetic fixtures and automated checks.
    checkpoint: Recreate the application locally and verify a saved book through a browser test after reload.
  next_steps: Add one feature at a time and study authentication and deployment as separate engineering topics.
- role: desktop-application-developer
  title: Desktop Application Developer
  summary: Explore desktop event-driven applications while making toolkit-specific gaps visible.
  entry_level: after-basics
  prerequisites:
  - Python functions and files
  - Basic testing
  - Access to a desktop computer
  outcome: A local notes prototype with saved data, a graphical workflow and explicit platform limits.
  stages:
  - title: Separate notes from the interface
    topics:
    - Application state
    - File persistence
    - Exceptions
    resources:
    - python-tutorial
    practice: Implement note creation and saving before adding graphical controls.
    checkpoint: Recover notes after restart and handle a missing file predictably.
  - title: Learn a desktop event loop
    topics:
    - Widgets and layout
    - Callbacks
    - UI responsiveness
    resources: []
    practice: Use separately verified toolkit material to connect a text field and save button to the note functions.
    checkpoint: Create and save a note without freezing the interface.
    gap: No dedicated desktop GUI toolkit tutorial is verified in the catalogue; select platform-compatible official
      documentation before this implementation.
  - title: Handle desktop lifecycle choices
    topics:
    - File dialogs
    - Unsaved changes
    - Keyboard navigation
    resources: []
    practice: Specify save, cancel and close behavior and implement a visible unsaved-changes state.
    checkpoint: Show cancel preserving work and keyboard access to the save action.
    gap: Toolkit-specific documentation for dialogs and application lifecycle remains unverified; the Python language
      tutorial does not cover these responsibilities.
  - title: Deliver the desktop mini-project
    topics:
    - Core regression tests
    - Data recovery
    - Platform instructions
    resources:
    - pytest-getting-started
    - python-tutorial
    practice: Deliver the notes prototype with persistence tests and instructions for its supported operating system.
    checkpoint: A repeated run restores notes and a corrupted test file produces a useful error rather than silent
      data loss.
  next_steps: Verify packaging, platform accessibility and update behavior for the chosen toolkit before distributing
    the application.
- role: forward-deployed-engineer
  title: Forward Deployed Engineer
  summary: Adapt a product to a fictional customer workflow using explicit acceptance evidence.
  entry_level: experience-required
  prerequisites:
  - Experience building and testing a service
  - SQL and HTTP fundamentals
  - Ability to explain technical trade-offs
  outcome: A synthetic customer integration with acceptance tests, rollback instructions and a handover.
  stages:
  - title: Discover the operational need
    topics:
    - Stakeholder questions
    - Workflow mapping
    - Acceptance criteria
    resources:
    - open-practice-library
    practice: Define a fictional support-team workflow with three constraints and measurable success conditions.
    checkpoint: Trace each requested change to an example or an explicitly labelled assumption.
  - title: Inspect integration boundaries
    topics:
    - API contracts
    - Data mapping
    - Failure ownership
    resources:
    - fastapi-tutorial
    - arc42-template
    practice: Define source and target schemas for synthetic tickets and diagram an adapter boundary.
    checkpoint: Explain who retries transfers and which system owns each field.
  - title: Prove a limited adaptation
    topics:
    - Input validation
    - Reconciliation
    - Idempotency
    resources:
    - python-tutorial
    - pytest-getting-started
    - db-browser-for-sqlite
    practice: Import synthetic tickets through an adapter and record rejected records separately.
    checkpoint: Repeat the import without duplicates and reconcile source, accepted and rejected counts.
  - title: Deliver the customer-case mini-project
    topics:
    - Acceptance tests
    - Rollout and rollback
    - Operational handover
    resources:
    - madr
    - pytest-getting-started
    practice: Deliver a before-and-after demonstration and a rollback procedure for the fictional customer.
    checkpoint: Replay the acceptance scenarios and restore the original state from the documented procedure.
  next_steps: Seek supervised work with organizational constraints; do not use customer data without permission
    or present a fictional case as customer experience.
- role: cloud-software-engineer
  title: Cloud Software Engineer
  summary: Make an application portable and observable in a local cloud-style lab.
  entry_level: after-basics
  prerequisites:
  - A working small application
  - Basic Linux commands
  - HTTP and Git
  outcome: A containerized local service with external configuration, readiness checks and recovery evidence.
  stages:
  - title: Separate configuration and state
    topics:
    - External settings
    - Persistent state
    - Application logs
    resources:
    - docker-docs-get-started
    practice: Move settings out of application code and identify the records that must survive restart.
    checkpoint: Change a non-secret setting without editing source and locate the persisted sample data.
  - title: Build a portable service
    topics:
    - Container images
    - Ports and volumes
    - Process lifecycle
    resources:
    - docker-docs-get-started
    - container-training
    practice: Containerize the service and run it with a disposable local database volume.
    checkpoint: Rebuild the image and retrieve the saved sample record from the retained volume.
  - title: Observe dependency failures
    topics:
    - Readiness checks
    - Timeouts
    - Recovery behavior
    resources:
    - container-training
    - system-design-primer
    practice: Stop the local dependency and compare logs and readiness before and after recovery.
    checkpoint: Show an unavailable readiness result during the outage and a successful request after recovery.
  - title: Deliver a recovery mini-project
    topics:
    - Deployment configuration
    - Version rollback
    - Resource observations
    resources:
    - container-training
    - madr
    practice: Provide repeatable local deployment instructions, a previous image version and a measured restart
      exercise.
    checkpoint: Recreate the lab and roll back while preserving the agreed sample records.
  next_steps: Choose a cloud provider only when needed, check billing explicitly and study its access model before
    provisioning resources.
- role: integration-developer
  title: Integration Developer
  summary: Transfer synthetic records between systems without losing meaning or recoverability.
  entry_level: after-basics
  prerequisites:
  - Basic programming
  - HTTP and JSON
  - Simple SQL
  outcome: A local adapter with documented mappings, bounded retries and duplicate protection.
  stages:
  - title: Map two contracts
    topics:
    - Field semantics
    - Schema mapping
    - Data ownership
    resources:
    - mdn-web-docs
    - arc42-template
    practice: Map a fictional shop order to a warehouse record, including units and missing values.
    checkpoint: Explain every mapped field and flag ambiguous transformations instead of guessing.
  - title: Implement an adapter
    topics:
    - Serialization
    - Validation
    - Error responses
    resources:
    - python-tutorial
    - fastapi-tutorial
    practice: Build a local endpoint that validates orders and produces the warehouse schema.
    checkpoint: Valid fixtures transform correctly and malformed fixtures return a documented error.
  - title: Make repeated delivery safe
    topics:
    - Idempotency keys
    - Retry limits
    - Reconciliation
    resources:
    - pytest-getting-started
    - db-browser-for-sqlite
    practice: Store processed message IDs and record failed transfers in a review table.
    checkpoint: Sending the same message twice creates one record and every failure remains traceable.
  - title: Deliver the integration mini-project
    topics:
    - Contract tests
    - Schema versions
    - Recovery runbook
    resources:
    - pytest-getting-started
    - madr
    practice: Support a second message version and document a controlled replay of rejected messages.
    checkpoint: Test both supported versions and reconcile the replay without creating duplicates.
  next_steps: Study messaging platforms and distributed transactions after understanding failures and reconciliation
    in the local adapter.
- role: embedded-software-engineer
  title: Embedded Software Engineer
  summary: Connect programs to device inputs and outputs with explicit timing checks.
  entry_level: after-basics
  prerequisites:
  - Basic programming and loops
  - Binary numbers and units
  - A supported board or suitable simulator
  outcome: A nonblocking device-state prototype with input handling and labelled hardware or simulation evidence.
  stages:
  - title: Understand device execution
    topics:
    - Pins and peripherals
    - Main loop
    - Build and flash
    resources:
    - arduino-built-in-examples
    practice: Follow Blink on supported equipment and label the required board and output.
    checkpoint: Explain what runs on the device and distinguish a measured signal from simulated behavior.
  - title: Read inputs and track state
    topics:
    - Digital inputs
    - State machines
    - Input noise
    resources:
    - raspberry-pi-pico-examples
    practice: Use a matching-board input example to design button-controlled operating states.
    checkpoint: Predict and record output for a sequence of inputs, including repeated transitions.
  - title: Avoid blocking the device
    topics:
    - Timers
    - Scheduling
    - Debug output
    resources:
    - zephyr-synchronization-sample
    practice: Study the synchronization example and compare blocking behavior with scheduled updates in a lab.
    checkpoint: Demonstrate that a second periodic action continues while the first waits.
  - title: Deliver the device mini-project
    topics:
    - State-table tests
    - Timing observations
    - Fault states
    resources:
    - arduino-built-in-examples
    - raspberry-pi-pico-examples
    practice: Build a button-controlled indicator with timing checks and a documented safe output state.
    checkpoint: Reproduce normal input, a noisy-input case and restart, labelling each hardware or simulation result.
  next_steps: Choose one platform for deeper study; electrical design, real-time assurance and safety engineering
    require specialist instruction.
- role: firmware-engineer
  title: Firmware Engineer
  summary: Explore device startup, peripheral configuration and bounded execution.
  entry_level: after-basics
  prerequisites:
  - C fundamentals including pointers
  - Binary and hexadecimal notation
  - Basic digital electronics
  outcome: A peripheral firmware prototype with initialization notes, fault handling and timing evidence.
  stages:
  - title: Trace startup and memory
    topics:
    - Reset sequence
    - Memory layout
    - Initialization
    resources:
    - beejs-guides
    - raspberry-pi-pico-examples
    practice: Compile a minimal board example and annotate startup calls and global state.
    checkpoint: Explain initialization order and distinguish software variables from hardware registers.
  - title: Configure a peripheral
    topics:
    - Peripheral interfaces
    - Clock settings
    - Pin assignment
    resources:
    - raspberry-pi-pico-examples
    practice: Adapt a serial or timer example and document its pins and selected rate.
    checkpoint: Compare the configured output with a measurement of stated resolution.
  - title: Bound waits and recover
    topics:
    - Interrupt boundaries
    - Timeouts
    - Watchdog concepts
    resources: []
    practice: Use the exact device documentation to design a bounded operation and a recovery state.
    checkpoint: A missing peripheral response reaches a defined timeout instead of waiting forever.
    gap: A board-specific reference for interrupts, watchdogs and register-level recovery is not verified in the
      catalogue and must be checked before implementation.
  - title: Deliver the firmware mini-project
    topics:
    - Build settings
    - Restart checks
    - Timing report
    resources:
    - raspberry-pi-pico-examples
    practice: Deliver the peripheral example with a startup diagram and normal, timeout and restart observations.
    checkpoint: Rebuild and reproduce the checks on the specified board or simulator.
  next_steps: Verify the device manual, debugger and update-integrity guidance before advancing beyond the lab;
    one board example is not complete firmware preparation.
- role: robotics-engineer
  title: Robotics Engineer
  summary: Model sensing and motion before operating a physical robot.
  entry_level: after-basics
  prerequisites:
  - Python functions
  - Algebra and trigonometry
  - Ability to plot numerical results
  outcome: A simulated two-dimensional controller with measured tracking error and explicit physical-validation
    gaps.
  stages:
  - title: Represent position and motion
    topics:
    - Vectors and frames
    - Discrete time
    - Pose updates
    resources:
    - 3blue1brown-linear-algebra
    - python-tutorial
    practice: Implement two-dimensional robot motion and plot its trajectory.
    checkpoint: Check a straight move and a turn against hand-calculated positions.
  - title: Close a feedback loop
    topics:
    - Setpoints and error
    - Proportional control
    - Actuator limits
    resources: []
    practice: Simulate steering with bounded output and a noisy position measurement.
    checkpoint: Plot error over time and demonstrate a case with oscillation or saturation.
    gap: No dedicated robotics or control-theory curriculum is verified; stability and tuning require a suitable
      specialist source.
  - title: Map sensing to interfaces
    topics:
    - Sampling intervals
    - Actuator commands
    - Missing measurements
    resources:
    - microsoft-iot-for-beginners
    practice: Map simulated measurements and commands to a device interface without connecting moving hardware.
    checkpoint: Explain sampling delay and define the response to an absent reading.
  - title: Deliver the robot simulation
    topics:
    - Trajectory tests
    - Noise experiments
    - Reproducible parameters
    resources:
    - python-tutorial
    - pytest-getting-started
    practice: Package a waypoint-following simulation with parameter settings and fixed failure cases.
    checkpoint: Reproduce straight and turning paths, compare tracking error and show the missing-sensor response.
  next_steps: Use supervised robotics instruction for dynamics, localization and physical safety before operating
    moving mechanisms.
- role: hardware-engineer
  title: Hardware Engineer
  summary: Explore digital circuit design while exposing missing electronics and laboratory coverage.
  entry_level: after-basics
  prerequisites:
  - Basic algebra
  - Binary notation
  - Introductory physics
  outcome: A simulated digital circuit with test vectors and a separate physical-verification plan.
  stages:
  - title: Relate electrical quantities
    topics:
    - Voltage and current
    - Power and units
    - Measurement uncertainty
    resources:
    - khan-academy-math
    practice: Calculate units and hypothetical low-voltage power and state every electrical assumption.
    checkpoint: Check dimensions and identify properties that still require a circuit model.
    gap: The mathematics resource supports calculations but no dedicated verified introductory circuit-analysis
      course is present.
  - title: Build combinational logic
    topics:
    - Boolean functions
    - Truth tables
    - Logic composition
    resources:
    - nand2tetris
    practice: Construct a small arithmetic or selection circuit in the course hardware simulator.
    checkpoint: Pass supplied tests and explain each row of a small truth table.
  - title: Identify physical constraints
    topics:
    - Timing margins
    - Signal levels
    - Thermal limits
    resources: []
    practice: List component ratings and measurements needed for a hypothetical physical implementation.
    checkpoint: Distinguish logical correctness from timing, voltage and thermal claims a logic simulator cannot
      prove.
    gap: No verified datasheet-reading, signal-integrity or laboratory-measurement curriculum is available; do not
      build hardware from this checklist alone.
  - title: Deliver the digital design study
    topics:
    - Test vectors
    - Design alternatives
    - Verification boundaries
    resources:
    - nand2tetris
    practice: Compare two implementations of a logic function and supply simulations plus a proposed physical-test
      plan.
    checkpoint: Both implementations pass the same logic tests while electrical compatibility remains explicitly
      unverified.
  next_steps: Seek a structured electronics curriculum and supervised laboratory practice; microcontroller tutorials
    do not replace circuit, PCB or hardware qualification training.
- role: iot-engineer
  title: IoT Engineer
  summary: Connect device-like measurements to a local receiver with clear failure behavior.
  entry_level: after-basics
  prerequisites:
  - Basic programming
  - Simple HTTP and networks
  - A supported or simulated sensor environment
  outcome: A local telemetry prototype with validated messages and bounded reconnect behavior.
  stages:
  - title: Acquire a measurement
    topics:
    - Sensor inputs
    - Units and sampling
    - Synthetic signals
    resources:
    - microsoft-iot-for-beginners
    practice: Use a virtual or supported sensor exercise to generate a labelled measurement sequence.
    checkpoint: Explain units and sampling interval and identify synthetic readings.
  - title: Define the message contract
    topics:
    - Device identity
    - Timestamps
    - Payload validation
    resources:
    - microsoft-iot-for-beginners
    - fastapi-tutorial
    practice: Send synthetic measurements to a local service using dummy device IDs and an explicit schema.
    checkpoint: Reject a message with an invalid unit or missing required field.
  - title: Handle interrupted delivery
    topics:
    - Buffer limits
    - Reconnection
    - Duplicate messages
    resources:
    - microsoft-iot-for-beginners
    - computer-networks-systems-approach
    practice: Disconnect the receiver and implement a bounded buffering and replay policy.
    checkpoint: Restore delivery and account for accepted, duplicate and intentionally dropped readings.
  - title: Deliver the telemetry mini-project
    topics:
    - Access boundaries
    - Observability
    - Recovery checks
    resources:
    - microsoft-iot-for-beginners
    - pytest-getting-started
    practice: Deliver a virtual-sensor pipeline with synthetic data and an outage exercise.
    checkpoint: Reproduce normal operation, malformed input and restart without claiming production device security.
  next_steps: Study secure provisioning and device updates separately and check hardware or cloud costs before choosing
    external services.
- role: mechatronics-engineer
  title: Mechatronics Engineer
  summary: Explore motion, electronics and control through a bounded simulation.
  entry_level: after-basics
  prerequisites:
  - Algebra and trigonometry
  - Basic mechanics and units
  - Basic programming
  outcome: A simulated positioning mechanism with limits and an engineering assumptions log.
  stages:
  - title: Model a mechanism
    topics:
    - Position and velocity
    - Loads and units
    - Kinematic relationships
    resources:
    - khan-academy-math
    - 3blue1brown-linear-algebra
    practice: Draw a positioning axis and compute travel from a hypothetical motor-to-motion ratio.
    checkpoint: Check units and show how changing the ratio changes predicted position.
    gap: No dedicated mechanics or machine-design course is verified; mathematics alone does not validate a mechanism.
  - title: Connect mechanical and electrical limits
    topics:
    - Actuator characteristics
    - Power budget
    - Mechanical stops
    resources: []
    practice: Create a hypothetical actuator table with labelled assumptions and prohibited operating regions.
    checkpoint: Explain why a proposed motion could exceed torque, speed or power limits.
    gap: Motor-drive, actuator-selection and electrical-safety sources are not verified; do not select real hardware
      solely from this exercise.
  - title: Simulate feedback and failures
    topics:
    - Position error
    - Discrete controller
    - Limit detection
    resources:
    - python-tutorial
    practice: Simulate the axis with bounded control output and a missing-sensor state.
    checkpoint: Plot position and demonstrate entry into the defined limit state.
    gap: A specialist control-theory source remains unverified; a simulated response does not establish stability
      or functional safety.
  - title: Deliver the positioning study
    topics:
    - Requirements and tolerances
    - Failure tests
    - Uncertainty report
    resources:
    - pytest-getting-started
    practice: Deliver simulation parameters and normal, overload and sensor-loss cases.
    checkpoint: Reproduce planned motion and distinguish software checks from unverified physical performance.
  next_steps: Study mechanics, control and electronics with supervised laboratory work before building powered mechanisms;
    these exercises cannot certify safety.
- role: microsystems-engineer
  title: Microsystems Engineer
  summary: Examine a simplified microsensor model without implying fabrication training.
  entry_level: experience-required
  prerequisites:
  - Electronics and physics foundations
  - Calculus and linear algebra
  - Numerical programming
  outcome: A computational microsensor study with sensitivity analysis and calibration assumptions.
  stages:
  - title: Frame a microsystem model
    topics:
    - Transduction principle
    - Dimensions and scaling
    - Operating assumptions
    resources: []
    practice: Specify a hypothetical microsensor, measured quantity and simplified physical relationship.
    checkpoint: Check units and explicitly exclude physical effects outside the model.
    gap: No MEMS, microfabrication or microsensor course is verified; a specialist source must support the selected
      physical relationship.
  - title: Analyze sensitivity
    topics:
    - Symbolic relationships
    - Parameter derivatives
    - Numerical sweeps
    resources:
    - sympy
    - 3blue1brown-calculus
    practice: Vary two model parameters and plot the predicted output.
    checkpoint: Compare a numerical output change with the derivative of the same relationship.
  - title: Plan measurement evidence
    topics:
    - Calibration error
    - Repeatability
    - Process variation
    resources:
    - openintro-statistics
    practice: Generate synthetic calibration observations and estimate residual error.
    checkpoint: Distinguish measurement variation from model error and label every observation as synthetic.
    gap: The statistics material does not cover cleanroom processes or device metrology; these specialist sources
      remain unverified.
  - title: Deliver the microsensor study
    topics:
    - Reproducibility
    - Sensitivity limits
    - Validation plan
    resources:
    - sympy
    - python-tutorial
    practice: Deliver the model, synthetic calibration analysis and proposed laboratory-validation plan.
    checkpoint: Another reader reproduces the parameter sweep and identifies every claim requiring a physical measurement.
  next_steps: Obtain specialist microfabrication and metrology instruction in a supervised facility; a numerical
    study is not a validated device.
- role: android-developer
  title: Android Developer
  summary: Build a small Android application with Kotlin, Compose and persistent state.
  entry_level: from-zero
  prerequisites:
  - Basic computer skills
