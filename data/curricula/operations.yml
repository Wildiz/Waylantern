- role: computer-technician
  title: Computer Technician
  summary: Diagnose a fictional computer fault and plan safe physical work without confusing a simulation
    with repair experience.
  entry_level: from-zero
  prerequisites:
  - Know basic computer controls and files.
  - Use authorised training equipment; do not open powered or unfamiliar equipment.
  outcome: A component map, diagnostic evidence and a safe repair/verification plan for a practice computer
    scenario.
  stages:
  - title: Identify computer components
    topics:
    - Storage and memory
    - Power, peripherals and boot stages
    resources:
    - professor-messer
    practice: Use introductory A+ material to label a computer diagram and connect a boot or peripheral
      symptom to possible component categories.
    checkpoint: Distinguish a symptom from proof of a failed part and list observations needed before
      replacing it.
  - title: Learn safe physical procedures
    topics:
    - Power isolation and handling
    - Electrostatic and model-specific precautions
    resources: []
    practice: Write a supervised-work checklist using the exact manufacturer guidance required for a proposed
      training device.
    checkpoint: Mark any unavailable manufacturer procedure as a blocker rather than inventing disassembly
      or battery-handling steps.
    gap: No reviewed device-specific repair, battery-safety or electrical-work manual is included in the
      catalogue.
  - title: Separate software from hardware evidence
    topics:
    - Boot and storage observations
    - Reversible diagnostic checks
    resources:
    - microsoft-windows-troubleshooting
    practice: Read a relevant Windows diagnostic article and plan non-destructive observations for a fictional
      boot or device problem.
    checkpoint: The plan identifies what a software log can show and what still requires approved physical
      diagnostics.
  - title: 'Capstone: prepare a repair handover'
    topics:
    - Part-replacement justification
    - Post-work acceptance checks
    resources: []
    practice: Create a fictional repair report with observations, candidate causes, a supervised action
      plan and checks for boot, data and peripherals.
    checkpoint: The report preserves uncertainty and does not claim a component was repaired or replaced
      unless that work actually occurred.
    gap: A complete supervised repair lab and model-specific procedures remain missing; a written plan
      is not hands-on hardware competence.
  next_steps: Obtain supervised hands-on training and current manufacturer procedures before repairing
    customer equipment or handling hazardous components.
- role: computer-network-support-specialist
  title: Computer Network Support Specialist
  summary: Narrow a user connectivity issue through host, name-resolution and network-path checks.
  entry_level: from-zero
  prerequisites:
  - Use basic system settings.
  - Have permission to inspect only an isolated lab network and its traffic.
  outcome: A connectivity case showing structured checks, relevant packet evidence and a bounded repair
    or escalation.
  stages:
  - title: Understand one host connection
    topics:
    - Addresses, gateways and DNS
    - Local versus remote failures
    resources:
    - computer-networks-systems-approach
    practice: Draw how a fictional user reaches a service and identify the host, gateway, resolver and
      destination.
    checkpoint: Explain why a failed name lookup is different from a failed connection to a known address.
  - title: Collect reproducible connection evidence
    topics:
    - Interface and route checks
    - Transport reachability
    resources:
    - mininet
    practice: Use a small emulator example to compare normal connectivity with a missing route or stopped
      endpoint.
    checkpoint: Record the commands and outputs and explain which part of the path each check examines.
  - title: Inspect a relevant capture
    topics:
    - DNS queries and responses
    - Connection attempts and responses
    resources:
    - wireshark
    practice: Capture the isolated test and compare a working name lookup or TCP connection with the failed
      case.
    checkpoint: Point to the relevant packets and avoid inferring a network fault solely from one timeout.
  - title: 'Capstone: support an affected user'
    topics:
    - Minimal changes
    - Clear escalation evidence
    resources:
    - glpi
    practice: Create a fictional connectivity ticket with the host settings, failed test, justified correction
      or escalation and a repeated user-facing check.
    checkpoint: The receiving technician can locate the fault boundary without requesting passwords or
      exposing unrelated packet data.
  next_steps: Practise supervised wireless, VPN and enterprise access cases with current approved procedures
    for the organisation.
- role: operations-support-analyst
  title: Operations Support Analyst
  summary: Monitor a service, follow a bounded runbook and escalate deviations with usable evidence.
  entry_level: after-basics
  prerequisites:
  - Read basic Linux commands and service logs.
  - Understand what a runbook permits an operator to change.
  outcome: A shift-style operations record with health checks, a failed scheduled task and a documented
    escalation.
  stages:
  - title: Identify service expectations
    topics:
    - Health checks and schedules
    - Ownership and dependencies
    resources:
    - linux-upskill-challenge
    practice: Create a fictional operations checklist for a practice service and one scheduled job, including
      expected outputs.
    checkpoint: Each check has a time, owner and explicit success condition rather than only a command
      name.
  - title: Investigate a failed operation
    topics:
    - Task output and logs
    - Environment and time context
    resources:
    - linux-upskill-challenge
    practice: Make a harmless practice job fail because of a missing input, then preserve its error and
      relevant log context.
    checkpoint: Explain the failed step without overwriting the evidence or assuming every nonzero exit
      has the same cause.
  - title: Apply runbook limits
    topics:
    - Approved retries
    - Escalation and handover
    resources: []
    practice: Write a bounded procedure saying when a retry is safe, when to stop and what evidence the
      next team needs.
    checkpoint: The procedure avoids repeating a state-changing job without checking for duplicate work.
    gap: No reviewed operations-runbook governance guide is catalogued; approval and retry rules are explicit
      practice assumptions.
  - title: 'Capstone: hand over an operational shift'
    topics:
    - Check completion records
    - Outstanding work and risk
    resources: []
    practice: Perform the checklist in a disposable lab, record the job failure and write a shift handover
      with ownership for unresolved work.
    checkpoint: The next operator can identify service state, completed actions and the precise next safe
      step.
    gap: The shift scenario is editorial and does not establish employer-specific operational authority
      or production experience.
  next_steps: Practise actual approved runbooks and controlled shift handovers with an experienced operations
    team.
- role: infrastructure-specialist
  title: Infrastructure Specialist
  summary: Connect compute, storage and networking requirements to a small reproducible infrastructure
    lab.
  entry_level: after-basics
  prerequisites:
  - Administer a basic operating-system service.
  - Understand IP addressing and resource limits.
  outcome: A dependency inventory and reproducible local infrastructure setup with capacity and recovery
    notes.
  stages:
  - title: Map the infrastructure boundary
    topics:
    - Compute, storage and network roles
    - Resource ownership
    resources:
    - system-design-primer
    practice: Diagram the infrastructure used by a small practice service and identify dependencies outside
      the operator's control.
    checkpoint: Each component has an observable function and a recorded ownership assumption.
  - title: Inspect capacity and connectivity
    topics:
    - CPU, memory and storage observations
    - Network reachability
    resources:
    - linux-upskill-challenge
    - computer-networks-systems-approach
    practice: Record local resource observations and the expected network path, then identify one potential
      constraint without guessing production capacity.
    checkpoint: The evidence distinguishes measured usage from an untested scaling estimate.
  - title: Reproduce a controlled configuration
    topics:
    - Infrastructure definitions
    - State and removal
    resources:
    - terraform-tutorials
    practice: Use the local Docker track to create a practice resource and repeat its setup and teardown
      from declared configuration.
    checkpoint: A clean run creates the expected local resource and cleanup is verified without affecting
      shared infrastructure.
  - title: 'Capstone: deliver an infrastructure handover'
    topics:
    - Failure and recovery evidence
    - Capacity and ownership notes
    resources: []
    practice: Combine the diagram, configuration, checks and one local failure/recovery demonstration
      into an operator handover.
    checkpoint: Another person can identify dependencies, reproduce the local setup and explain what real
      hardware or cloud behaviour remains untested.
    gap: The complete infrastructure assignment is editorial; no reviewed resource covers all physical,
      cloud, backup and enterprise infrastructure responsibilities.
  next_steps: Choose a compute, storage or network specialisation and gain supervised practice with the
    relevant current platform manuals.
