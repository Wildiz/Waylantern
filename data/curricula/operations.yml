group: operations
curricula:
- role: devops-engineer
  title: DevOps Engineer
  summary: Connect a small application change to a repeatable build, deployment and recovery workflow.
  entry_level: after-basics
  prerequisites:
  - Write and test a small program.
  - Use Git and navigate a Linux shell.
  outcome: A versioned application with recorded tests, a reproducible container build and a demonstrated
    rollback.
  stages:
  - title: Follow a change through Git
    topics:
    - Commits and branches
    - Reviewable changes
    resources:
    - github-skills-introduction-to-git
    - pro-git
    practice: Change one behaviour in a tiny application on a branch and record how a reviewer can test
      it.
    checkpoint: Show the diff and explain which commit introduced the change.
  - title: Build a checked artifact
    topics:
    - Automated test failures
    - Container images
    resources:
    - pytest-getting-started
    - docker-docs-get-started
    practice: Write a test for the behaviour, make it fail once deliberately, then build a container from
      the corrected source.
    checkpoint: Keep the failing and passing test outputs and identify the source version of the image.
  - title: Practise release and recovery
    topics:
    - Deployment configuration
    - Rollback evidence
    resources:
    - container-training
    practice: Run two local versions of the app, introduce a configuration fault and restore the previous
      working version.
    checkpoint: A local request demonstrates the fault and another demonstrates recovery; record the commands
      and logs.
  - title: 'Capstone: deliver one repeatable change'
    topics:
    - Build and release steps
    - Operational handover
    resources: []
    practice: Package the change, checks, local deployment and rollback in a documented workflow that
      another person can follow.
    checkpoint: A clean run reproduces the working release and rollback, with secret-free logs and explicit
      local resource requirements.
    gap: No reviewed resource covers this complete editorial delivery project; the earlier Git, testing
      and container material supplies its parts.
  next_steps: Add supervised CI and staging practice before taking responsibility for production releases.
- role: devsecops-engineer
  title: DevSecOps Engineer
  summary: Add focused security checks and controlled failure handling to a small delivery workflow.
  entry_level: after-basics
  prerequisites:
  - Build and test an application.
  - Understand Git, containers and basic HTTP.
  outcome: A delivery demonstration with an explicit threat, a failing security check, a corrected change
    and evidence of enforcement.
  stages:
  - title: Identify exposure in the application
    topics:
    - Trust boundaries
    - Input and credential risks
    resources:
    - owasp-top-10
    practice: Draw where input and credentials enter a tiny app and select one applicable risk from the
      reference.
    checkpoint: Explain the selected risk using a concrete input path rather than treating the Top 10
      as a complete threat model.
  - title: Turn one risk into a check
    topics:
    - Negative tests
    - Regression evidence
    resources:
    - pytest-getting-started
    practice: For an app you own, add a test that rejects an invalid input and demonstrate its failure
      before the correction.
    checkpoint: The check distinguishes the vulnerable and corrected versions without exposing credentials.
  - title: Control delivery permissions
    topics:
    - Least privilege
    - Artifact and secret handling
    resources: []
    practice: Draft a pipeline-permissions table and an artifact review checklist; identify where a secret
      would be supplied securely rather than committed.
    checkpoint: Each permission has a named purpose and the design excludes secrets from artifacts and
      logs.
    gap: No reviewed resource in the catalogue provides a complete pipeline-permissions or secret-scanning
      implementation guide.
  - title: 'Capstone: block a risky change'
    topics:
    - Release gates
    - Exception and recovery records
    resources: []
    practice: Run a local delivery script that stops on the security test failure, succeeds after correction
      and records the result for review.
    checkpoint: A deliberately unsafe version is blocked and a corrected version is released; document
      remaining threats and who may approve an exception.
    gap: This editorial project demonstrates one gate; a reviewed DevSecOps platform-hardening and software-supply-chain
      course is still missing.
  next_steps: Study identity, dependency integrity and organisation-specific security policy with an experienced
    delivery/security team.
- role: mlops-engineer
  title: MLOps Engineer
  summary: Make a trained model reproducible, deployable and observable through a small service lifecycle.
  entry_level: after-basics
  prerequisites:
  - Use Python, Git and Docker confidently.
  - Train and evaluate a simple model; the linked MLOps course expects substantial programming practice.
  outcome: A reproducible model experiment, versioned serving artifact and monitoring/retraining decision
    record.
  stages:
  - title: Reproduce a baseline experiment
    topics:
    - Data and parameter versions
    - Evaluation split
    resources:
    - datatalks-machine-learning-zoomcamp
    practice: Train a small model on a fixed public or synthetic dataset and save parameters, split rules
      and evaluation results.
    checkpoint: A repeat run can be traced to the same data and settings without leakage from the evaluation
      set.
  - title: Track and package the model
    topics:
    - Experiment tracking
    - Serving interfaces
    resources:
    - datatalks-mlops-zoomcamp
    practice: Follow the relevant tracking and deployment material to package the chosen model behind
      a local prediction endpoint.
    checkpoint: A request returns the expected response and the running artifact can be linked to a recorded
      experiment.
  - title: Define operational checks
    topics:
    - Prediction quality signals
    - Drift and retraining triggers
    resources:
    - datatalks-mlops-zoomcamp
    practice: Use synthetic shifted inputs to compare baseline and changed traffic, then write a proposed
      retraining trigger.
    checkpoint: Separate observed input change from unmeasured real-world prediction quality and explain
      when labels would be needed.
  - title: 'Capstone: recover a model release'
    topics:
    - Version rollback
    - Monitoring handover
    resources: []
    practice: Release a second model locally, compare its recorded checks with the baseline and restore
      the first version when a chosen check fails.
    checkpoint: A fresh operator can locate the model version, reproduce a prediction and follow the documented
      rollback decision.
    gap: The complete release-and-recovery exercise is editorial; the course supplies lifecycle topics
      rather than this exact assignment.
  next_steps: Practise delayed labels, privacy and supervised production monitoring before managing live
    model services.
- role: aiops-engineer
  title: AIOps Engineer
  summary: Evaluate whether an anomaly detector helps operators find incidents without hiding false alarms.
  entry_level: after-basics
  prerequisites:
  - Use Python and basic statistics.
  - Understand service logs and the difference between metrics and incidents.
  outcome: A documented baseline and anomaly experiment evaluated on labelled synthetic operational events.
  stages:
  - title: Build an operational event dataset
    topics:
    - Time ordering
    - Incident labels and missing data
    resources:
    - microsoft-data-science-for-beginners
    practice: Prepare a small synthetic time series with normal intervals, missing values and known incident
      windows.
    checkpoint: Explain each label and preserve a time-ordered evaluation segment that was not used to
      tune the detector.
  - title: Establish a simple alert baseline
    topics:
    - Threshold alerts
    - Precision and recall
    resources: []
    practice: Use a fixed threshold before trying a model and count true alarms, false alarms and missed
      labelled incidents.
    checkpoint: Provide a confusion table and explain the operator cost of a false alarm versus a miss.
    gap: No reviewed AIOps-specific evaluation resource is catalogued; this stage is an editorial operational-analysis
      exercise.
  - title: Compare an anomaly method
    topics:
    - Temporal leakage
    - Human review and drift
    resources: []
    practice: Compare one simple anomaly score with the threshold on the held-out interval and inspect
      its largest errors.
    checkpoint: Report whether the method improves the chosen measure and document cases where it should
      not trigger automated remediation.
    gap: A reviewed course on operational anomaly methods and safe AIOps integration is missing; do not
      treat general AI material as coverage.
  - title: 'Capstone: propose an operator-facing alert'
    topics:
    - Evidence summaries
    - Escalation safeguards
    resources: []
    practice: Produce a mock alert containing evidence, uncertainty and the next diagnostic check; test
      it against both a true incident and a false alarm.
    checkpoint: An operator can distinguish a signal from a diagnosis and no remediation is executed automatically.
    gap: No reviewed resource covers this complete AIOps alert workflow; it remains an explicitly bounded
      editorial project.
  next_steps: Validate real alert usefulness and data handling under supervision before integrating any
    automated action.
- role: cloudops-engineer
  title: CloudOps Engineer
  summary: Operate a small cloud-style service using inventory, health checks and a controlled maintenance
    record.
  entry_level: after-basics
  prerequisites:
  - Administer a basic Linux service.
  - Understand cloud account permissions and that hosted services can incur charges.
  outcome: An inventory, monitoring checklist and recovery record for a disposable practice deployment.
  stages:
  - title: Map cloud resources and responsibilities
    topics:
    - Service inventory
    - Account and region boundaries
    resources:
    - aws-skill-builder
    practice: Select introductory provider material and draw a hypothetical service using compute, storage
      and networking; label ownership and billing boundaries.
    checkpoint: Identify which resources would exist, who may change them and how they would be removed;
      reading does not require buying a lab.
  - title: Make configuration repeatable
    topics:
    - Declared configuration
    - State and cleanup
    resources:
    - terraform-tutorials
    practice: Use the local Docker getting-started track to describe and recreate a practice resource
      without using a paid cloud account.
    checkpoint: Show the declared inputs, resulting state and successful removal; note differences from
      a real provider deployment.
  - title: Write health and maintenance checks
    topics:
    - Service status and logs
    - Backup and change windows
    resources: []
    practice: Draft checks for availability and resource pressure, then record a maintenance plan for
      the hypothetical cloud service.
    checkpoint: Each check has expected output, an escalation condition and an owner; recovery assumptions
      are explicitly identified.
    gap: A provider-specific reviewed CloudOps monitoring, backup and identity runbook is not available
      in the catalogue.
  - title: 'Capstone: operate a disposable service'
    topics:
    - Incident evidence
    - Cost and resource closure
    resources: []
    practice: Recreate the local service, simulate one outage, restore it and reconcile the inventory
      with the resources left after cleanup.
    checkpoint: The report shows health before/after, the recovery timeline and evidence that no practice
      resources remain.
    gap: The local simulation is an editorial operations exercise, not verification of live cloud availability
      or billing controls.
  next_steps: Choose one provider and verify current monitoring, backup, identity and billing procedures
    before a supervised real deployment.
- role: gitops-engineer
  title: GitOps Engineer
  summary: Use version-controlled desired state and reconciliation evidence to reason about controlled
    deployments.
  entry_level: after-basics
  prerequisites:
  - Use Git branches and review changes.
  - Understand YAML and basic Kubernetes resources.
  outcome: A desired-state repository and a reconciliation demonstration that distinguishes approved change,
    drift and rollback.
  stages:
  - title: Describe the workload declaratively
    topics:
    - Resource manifests
    - Desired versus observed state
    resources:
    - kubernetes-tutorials
    practice: Create a small local workload using the relevant basics tutorial and record its manifest
      and observed state.
    checkpoint: Explain which fields express intent and which observations show what actually runs.
  - title: Review desired-state changes
    topics:
    - Version history
    - Environment boundaries
    resources:
    - pro-git
    practice: Commit the manifest, propose a configuration change on a branch and document what must be
      reviewed before merge.
    checkpoint: A reviewer can identify the intended environment, changed behaviour and previous working
      revision.
  - title: Understand reconciliation and drift
    topics:
    - Controller behaviour
    - Credential and deletion boundaries
    resources: []
    practice: Write a dry-run reconciliation table for approved state, manual drift and a deleted resource;
      state what a controller should restore or leave untouched.
    checkpoint: Distinguish a Git change, a reconciliation action and a deployment result, including failure
      handling.
    gap: No reviewed GitOps-controller setup or security guide is catalogued; this stage models behaviour
      rather than inventing controller commands.
  - title: 'Capstone: demonstrate change and recovery'
    topics:
    - Reconciliation records
    - Rollback limitations
    resources: []
    practice: In a disposable local lab, apply the approved manifest changes and record a simulated reconciliation/rollback
      sequence; clearly mark manual actions.
    checkpoint: Show the repository versions and observed states, and explain that a manual simulation
      does not demonstrate an actual GitOps controller.
    gap: A complete automated GitOps-controller lab is missing; its absence must remain visible in this
      editorial capstone.
  next_steps: Add a reviewed controller-specific lab and least-privilege credentials before describing
    the workflow as fully automated GitOps.
- role: dataops-engineer
  title: DataOps Engineer
  summary: Make a small data workflow testable, repeatable and explainable when an input or scheduled
    run fails.
  entry_level: after-basics
  prerequisites:
  - Write basic Python and SQL.
  - Use Git and understand a table schema.
  outcome: A repeatable synthetic-data pipeline with quality checks, retry evidence and a recovery note.
  stages:
  - title: Define input and output expectations
    topics:
    - Schema and ownership
    - Data-quality rules
    resources:
    - datatalks-data-engineering-zoomcamp
    practice: Describe a small synthetic source table and the fields and quality rules expected by a downstream
      consumer.
    checkpoint: Examples include a valid row and two rejected cases with reasons.
  - title: Schedule a traceable transformation
    topics:
    - Workflow dependencies
    - Run identifiers
    resources:
    - airflow-tutorial
    practice: Follow the relevant tutorial to run a small transformation, preserving the input version
      and a per-run result.
    checkpoint: A run can be traced from its input through its tasks to a recorded output.
  - title: Handle failure without corrupting results
    topics:
    - Retries and idempotency
    - Quality gates
    resources:
    - airflow-tutorial
    practice: Inject a missing input or duplicate row into the practice data and record how the pipeline
      rejects or safely reprocesses it.
    checkpoint: Rerunning the same input does not duplicate accepted output, and the failure is visible
      to an operator.
  - title: 'Capstone: recover and hand over a data run'
    topics:
    - Consumer impact
    - Recovery evidence
    resources: []
    practice: Demonstrate a failed run and a corrected rerun, then write the incident and the downstream
      validation required before releasing the output.
    checkpoint: A reader can locate the faulty input, recovery action and checks protecting the consumer.
    gap: This complete data-operations handover is an editorial exercise; the workflow tutorials do not
      define an organisation-wide DataOps process.
  next_steps: Study access control, data lineage and supervised backfills before operating pipelines with
    sensitive or business-critical data.
- role: finops-practitioner
  title: FinOps Practitioner
  summary: Analyse a fictional cloud bill and propose measurable cost decisions with owners and service
    trade-offs.
  entry_level: experience-required
  prerequisites:
  - Understand common cloud resource and pricing models.
  - Have practical experience discussing service ownership and operational constraints.
  - Use spreadsheets or SQL to reconcile totals.
  outcome: A reconciled synthetic spend report, allocation policy, forecast and justified optimisation
    proposal.
  stages:
  - title: Construct a defensible cost model
    topics:
    - Usage units and rates
    - Credits and shared charges
    resources: []
    practice: Create a fictional bill with compute hours, storage quantities, transfer charges and one
      credit; state all assumptions.
    checkpoint: The total reconciles with unit rates and no invented number is presented as a current
      provider price.
    gap: No reviewed FinOps cost-management curriculum or current provider price source is catalogued.
  - title: Allocate costs to accountable owners
    topics:
    - Labels and allocation rules
    - Shared-cost treatment
    resources: []
    practice: Assign synthetic charges to two teams and one shared platform, documenting what remains
      unallocated.
    checkpoint: The allocations sum to the original bill and every shared-charge rule is explained.
    gap: A reviewed FinOps allocation and governance guide is missing; the allocation policy is a stated
      practice assumption.
  - title: Compare optimisation options
    topics:
    - Forecast uncertainty
    - Reliability and commitment risks
    resources: []
    practice: Compare deleting an idle resource, rightsizing and a hypothetical commitment using estimated
      usage ranges.
    checkpoint: The recommendation includes savings assumptions, break-even conditions and a service-risk
      owner.
    gap: No reviewed resource establishes current discount products, purchasing terms or FinOps optimisation
      standards.
  - title: 'Capstone: present a cost decision'
    topics:
    - Action ownership
    - Measurement after change
    resources: []
    practice: Prepare a one-page cost review with an allocation chart, forecast range and one proposed
      action with a follow-up date.
    checkpoint: A stakeholder can identify the baseline, approved action, expected saving and evidence
      that would invalidate it.
    gap: This is an editorial simulation using fictional prices, not financial advice, a certification
      syllabus or a reviewed cloud-billing lab.
  next_steps: Use current provider billing documentation and an experienced finance/engineering partner
    before making real purchasing commitments.
- role: site-reliability-engineer
  title: Site Reliability Engineer
  summary: Measure a small service, define a user-facing reliability target and practise recovery from
    one failure.
  entry_level: after-basics
  prerequisites:
  - Program and test a small service.
  - Read Linux logs and understand basic HTTP responses.
  outcome: A reproducible service lab with a measured reliability indicator, failure exercise and learning
    review.
  stages:
  - title: Identify the user-visible service
    topics:
    - Request outcomes
    - Dependencies and failure modes
    resources:
    - system-design-primer
    practice: Draw the request path of a tiny local service and distinguish latency, errors and complete
      unavailability.
    checkpoint: Each selected metric has a defined observation point and a user-visible meaning.
  - title: Define a measurable objective
    topics:
    - Service-level indicators
    - Objective windows and error budgets
    resources: []
    practice: Choose a success indicator, a time window and a hypothetical objective; calculate results
      from a synthetic request log.
    checkpoint: Show the numerator, denominator and remaining failure allowance without claiming it is
      an industry-mandated target.
    gap: No reviewed SRE objectives or error-budget guide is currently catalogued; this stage states explicit
      editorial assumptions.
  - title: Exercise safe recovery
    topics:
    - Failure injection
    - Rollback and evidence
    resources:
    - container-training
    practice: Stop a dependency in a disposable service lab, observe the effect and restore it using a
      recorded procedure.
    checkpoint: Requests and logs demonstrate the failure and recovery, not merely a restarted process.
  - title: 'Capstone: learn from an outage'
    topics:
    - Timeline and contributing factors
    - Follow-up actions
    resources: []
    practice: Combine the indicator, outage evidence and a short review that separates observation, hypothesis
      and corrective action.
    checkpoint: The review names one measurable reliability improvement and how its effect would be checked.
    gap: A complete reviewed SRE incident-management curriculum is missing; this capstone is a bounded
      service experiment.
  next_steps: Practise on-call, capacity planning and production changes under supervision; a local outage
    exercise is not operational experience.
- role: cloud-site-reliability-engineer
  title: Cloud Site Reliability Engineer
  summary: Reason about cloud failure boundaries and test the recovery assumptions of a small service.
  entry_level: after-basics
  prerequisites:
  - Operate a basic service and interpret availability measurements.
  - Understand cloud regions, zones and usage charges.
  outcome: A cloud failure-boundary design and a documented local simulation of detection and recovery.
  stages:
  - title: Map failure domains
    topics:
    - Shared dependencies
    - Zones and regional boundaries
    resources:
    - aws-skill-builder
    - system-design-primer
    practice: Use introductory provider material to diagram a hypothetical deployment and identify components
      that fail together.
    checkpoint: Separate a documented provider capability from an assumption that still needs verification.
  - title: Design observable recovery
    topics:
    - Health signals
    - Recovery-time and data-loss goals
    resources: []
    practice: Define detection signals and fictional recovery objectives for one component outage and
      one data loss scenario.
    checkpoint: Explain how each objective would be measured and which dependencies can prevent recovery.
    gap: No reviewed provider-specific reliability objective or disaster-recovery curriculum is available.
  - title: Make the practice environment reproducible
    topics:
    - Infrastructure state
    - Change review and removal
    resources:
    - terraform-tutorials
    practice: Use the local Docker tutorial to create a disposable dependency, record its state and recreate
      it after removal.
    checkpoint: A second setup reproduces the intended local configuration; the report states what cloud-specific
      behaviour it does not test.
  - title: 'Capstone: rehearse one cloud recovery plan'
    topics:
    - Failover decisions
    - Recovery verification
    resources: []
    practice: Simulate a component failure locally and write a cloud recovery plan using the observed
      evidence and explicitly untested provider assumptions.
    checkpoint: A reviewer can distinguish demonstrated local restoration from proposed cloud failover
      and data-restoration behaviour.
    gap: No reviewed live-cloud failover lab is catalogued; the capstone must not claim regional resilience
      from a local simulation.
  next_steps: Verify current provider guarantees and rehearse backups and regional recovery in an authorised
    staging environment with cost limits.
- role: platform-engineer
  title: Platform Engineer
  summary: Build a small reusable development capability and check whether a second developer can use
    it.
  entry_level: after-basics
  prerequisites:
  - Build a containerised service and use Git.
  - Understand basic developer workflows and Linux tooling.
  outcome: A reusable local project template with a clear interface, ownership notes and an observed setup
    trial.
  stages:
  - title: Find a recurring developer task
    topics:
    - User needs
    - Workflow friction
    resources:
    - open-practice-library
    practice: Interview a willing developer or record clearly labelled assumptions about starting a new
      service; choose one repeated setup problem.
    checkpoint: State the target user, repeated task and an observable sign of improvement without treating
      workshop guesses as validated needs.
  - title: Build the smallest paved path
    topics:
    - Reusable configuration
    - Service boundaries
    resources:
    - docker-docs-get-started
    - container-training
    practice: Package a minimal containerised service template with a start command, a health check and
      documented configuration inputs.
    checkpoint: A clean copy starts successfully with explicit prerequisites and no embedded credentials.
  - title: Set support and change expectations
    topics:
    - Versioning and ownership
    - Escape hatches and upgrades
    resources: []
    practice: 'Write the template contract: supported inputs, update policy, responsible maintainer and
      what users should do when it cannot meet a need.'
    checkpoint: A user can tell which behaviours are promised and which customisations fall outside the
      supported path.
    gap: No reviewed platform-product or internal-developer-platform lifecycle guide is catalogued.
  - title: 'Capstone: observe a fresh setup'
    topics:
    - Developer experience evidence
    - Support feedback
    resources: []
    practice: Ask another person to start a service from the template, or label a clean-machine self-trial
      explicitly, and fix one observed obstacle.
    checkpoint: Record setup success, the obstacle, the resulting change and a basic recovery procedure.
    gap: This is an editorial platform-capability project, not a verified enterprise platform curriculum
      or a production readiness claim.
  next_steps: Expand only after collecting user feedback; practise tenancy, access control and sustainable
    support before serving multiple teams.
- role: cloud-engineer
  title: Cloud Engineer
  summary: Translate service requirements into reproducible infrastructure and a documented deployment
    check.
  entry_level: after-basics
  prerequisites:
  - Understand a Linux service and basic IP networking.
  - Use Git and inspect command output.
  outcome: A disposable infrastructure configuration and a design explaining how it would map to a chosen
    cloud provider.
  stages:
  - title: Choose service requirements
    topics:
    - Compute and storage needs
    - Security and cost constraints
    resources:
    - aws-skill-builder
    practice: Describe a small practice service and identify the compute, storage, identity and network
      categories it needs.
    checkpoint: Each proposed component has a requirement and a documented assumption rather than an unexplained
      provider choice.
  - title: Understand network exposure
    topics:
    - Addressing and routing
    - Ports and trust boundaries
    resources:
    - computer-networks-systems-approach
    practice: Draw the service network and mark which clients may connect to each port.
    checkpoint: Explain the path of a request and distinguish public exposure from local or private access.
  - title: Provision a local infrastructure example
    topics:
    - Declarative resources
    - State and repeatability
    resources:
    - terraform-tutorials
    practice: Use the Docker tutorial to provision, inspect, change and remove a local practice resource.
    checkpoint: Show the plan, resulting resource and cleanup, and explain why state must be protected.
  - title: 'Capstone: make a reviewed deployment package'
    topics:
    - Configuration review
    - Validation and cleanup
    resources: []
    practice: Deliver the local configuration with a cloud mapping diagram, explicit unsupported assumptions
      and a fresh setup/removal trial.
    checkpoint: Another person can reproduce the local deployment and identify what still requires current
      provider documentation.
    gap: No single reviewed resource covers this complete cloud-engineering handover; the local project
      does not establish real cloud permissions, cost or resilience.
  next_steps: Choose and verify a provider-specific implementation guide before applying infrastructure
    to a paid account or a shared environment.
- role: network-engineer
  title: Network Engineer
  summary: Build and diagnose a small IP network using protocol reasoning and observable packet behaviour.
  entry_level: from-zero
  prerequisites:
  - Use files and basic computer settings.
  - Have a suitable isolated Linux/emulation lab or access to a supervised one.
  outcome: An addressed network diagram, connectivity tests and a packet-backed diagnosis of one deliberate
    fault.
  stages:
  - title: Learn what carries a request
    topics:
    - Ethernet and IP addressing
    - TCP, UDP and DNS
    resources:
    - computer-networks-systems-approach
    practice: Trace a hypothetical browser request from a host through its local network and name the
      protocol responsibility at each step.
    checkpoint: Explain the distinction between an address, a route, a transport port and a DNS name.
  - title: Construct an isolated network
    topics:
    - Subnets and default routes
    - Switch and router roles
    resources:
    - mininet
    practice: Adapt a small emulator example with multiple hosts and record addresses and expected connectivity.
    checkpoint: The diagram matches the configured hosts and tests distinguish reachable from intentionally
      unreachable paths.
  - title: Diagnose using packets and commands
    topics:
    - Capture filters
    - Layered fault isolation
    resources:
    - wireshark
    practice: Capture only lab traffic and compare a successful connection with a deliberate addressing
      or name-resolution fault.
    checkpoint: Use command output and packets to locate the faulty layer without sharing private traffic.
  - title: 'Capstone: repair a network fault'
    topics:
    - Change evidence
    - Post-change verification
    resources: []
    practice: Create a short fault ticket, apply one justified correction and repeat the connectivity
      tests against the original diagram.
    checkpoint: Before/after evidence supports the diagnosis and the fix does not silently broaden access.
    gap: The complete fault-and-handover assignment is editorial; emulator results do not establish real
      equipment performance.
  next_steps: Add supervised routing, switching, wireless and physical-network practice before changing
    organisational networks.
- role: systems-administrator
  title: Systems Administrator
  summary: Administer a disposable system through accounts, services, updates and a tested recovery step.
  entry_level: after-basics
  prerequisites:
  - Navigate a shell and explain files and permissions.
  - Use a disposable operating-system lab rather than a daily-use or production machine.
  outcome: A documented system configuration with account permissions, service checks and evidence of
    restoration.
  stages:
  - title: Manage identities and access
    topics:
    - Users and groups
    - Permissions and privilege
    resources:
    - linux-upskill-challenge
    practice: Create a fictional user and restricted practice directory, then test permitted and denied
      access.
    checkpoint: Show both access outcomes and explain why the user does not need full administrative privileges.
  - title: Operate and inspect services
    topics:
    - Package changes
    - Service status and logs
    resources:
    - linux-upskill-challenge
    - powershell-101
    practice: On one selected operating system, record an installed service, inspect status/logs and document
      a reversible configuration change.
    checkpoint: A functional request confirms service behaviour; distinguish Linux examples from Windows-specific
      commands.
  - title: Plan and test restoration
